<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprout">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <!-- PWA Manifest -->
  <link rel="manifest" href="sprout.webmanifest">
  <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141916" media="(prefers-color-scheme: dark)">
  <meta name="msapplication-TileColor" content="#09564a">
<title>Sprout</title>
<style>
  /* ── Design tokens ──
     Values are the ones in Sprout-iOS `Color+Sprout.swift`, light and dark, so
     the two surfaces are the same palette rather than two that resemble each
     other. Type is the system face: on an iPhone that is San Francisco, and
     `ui-rounded` is the SF Rounded the iOS app uses for titles and money. */
  :root {
    color-scheme: light dark;
    --bg: rgb(244,247,245);
    --card: #ffffff;
    --card-soft: rgb(236,241,237);
    --text1: rgb(18,31,24);
    --text2: rgb(66,85,74);
    --text3: rgb(107,124,114);
    --sage: rgb(26,148,117);
    --sage-dark: rgb(9,86,73);
    --sage-light: rgb(218,238,225);
    --sage-mist: rgb(233,245,237);
    --sage-text: rgb(9,86,73);
    --blue: rgb(60,107,201);
    --blue-dark: rgb(26,52,130);
    --blue-light: rgb(223,234,247);
    --blue-text: rgb(26,52,130);
    --berry: rgb(161,44,79);
    --berry-dark: rgb(107,22,53);
    --berry-light: rgb(249,230,236);
    --berry-text: rgb(107,22,53);
    --amber: rgb(210,149,46);
    --red: rgb(197,64,66);
    --red-light: rgb(251,230,230);
    --mint: rgb(110,241,188);
    --amber-bright: rgb(255,194,73);
    --red-bright: rgb(255,110,110);
    --border: rgb(213,223,216);
    --border-dark: rgb(176,193,181);
    --chip: rgb(232,240,234);
    --track: rgb(214,224,217);
    --shadow: rgba(0,0,0,0.07);
    --notice-bg: rgb(255,244,220);
    --notice-text: rgb(98,69,31);
    --notice-border: rgb(240,219,170);
    --scrim: rgba(18,31,24,0.38);
    --hero-personal: linear-gradient(135deg, rgb(7,94,81), rgb(12,121,101));
    --hero-grocery: linear-gradient(135deg, rgb(28,60,144), rgb(55,93,190));
    --hero-holiday: linear-gradient(135deg, rgb(83,14,40), rgb(143,34,71));
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* Older names still referenced from script. */
    --green: var(--sage-text);
    --text4: var(--text3);
    --divider: var(--border);
    --font-body: var(--font);
    --font-mono: var(--font-round);
    --font-display: var(--font-round);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgb(20,25,22);
      --card: rgb(32,38,34);
      --card-soft: rgb(25,31,27);
      --text1: rgb(232,238,234);
      --text2: rgb(176,190,180);
      --text3: rgb(134,150,140);
      --sage: rgb(38,168,134);
      --sage-dark: rgb(30,136,112);
      --sage-light: rgb(20,42,31);
      --sage-mist: rgb(17,34,25);
      --sage-text: rgb(72,196,160);
      --blue: rgb(86,132,224);
      --blue-dark: rgb(70,113,208);
      --blue-light: rgb(25,35,56);
      --blue-text: rgb(140,174,242);
      --berry: rgb(204,81,112);
      --berry-dark: rgb(187,64,99);
      --berry-light: rgb(50,20,29);
      --berry-text: rgb(230,130,155);
      --amber: rgb(227,168,70);
      --red: rgb(226,104,106);
      --red-light: rgb(51,25,25);
      --mint: rgb(78,208,156);
      --amber-bright: rgb(244,182,59);
      --red-bright: rgb(244,99,99);
      --border: rgb(45,54,48);
      --border-dark: rgb(65,78,69);
      --chip: rgb(30,39,33);
      --track: rgb(45,54,48);
      --shadow: rgba(0,0,0,0.30);
      --notice-bg: rgb(52,42,20);
      --notice-text: rgb(242,220,170);
      --notice-border: rgb(84,68,32);
      --scrim: rgba(0,0,0,0.55);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text1);
    font: 17px/1.35 var(--font);
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button:disabled, input:disabled { opacity: .45; cursor: not-allowed; }
  /* The whole view is rebuilt on every change, so anything animated on entry
     replays on every tap and keystroke. Pressed feedback is the one motion
     that survives a rebuild honestly. */
  button:not(:disabled):active, summary:active { opacity: .72; }
  :focus-visible { outline: 2px solid var(--accent, var(--sage)); outline-offset: 2px; }
  svg.ic { display: block; flex: none; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 99px; }

  /* ── Shell and per-section accent ── */
  #app { height: 100vh; height: 100dvh; }
  .shell {
    --accent: var(--sage); --accent-dark: var(--sage-dark); --accent-light: var(--sage-light);
    --accent-text: var(--sage-text); --hero: var(--hero-personal); --hero-glow: rgba(9,86,73,0.22);
    max-width: 480px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column; position: relative;
  }
  .shell[data-section="grocery"] {
    --accent: var(--blue); --accent-dark: var(--blue-dark); --accent-light: var(--blue-light);
    --accent-text: var(--blue-text); --hero: var(--hero-grocery); --hero-glow: rgba(26,52,130,0.22);
  }
  .shell[data-section="holiday"] {
    --accent: var(--berry); --accent-dark: var(--berry-dark); --accent-light: var(--berry-light);
    --accent-text: var(--berry-text); --hero: var(--hero-holiday); --hero-glow: rgba(107,22,53,0.24);
  }

  /* ── Header ── */
  .header {
    flex-shrink: 0;
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
  }
  .header-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .header h1 {
    flex: 1; min-width: 0; font: 800 34px/1.1 var(--font-round); letter-spacing: -0.4px; color: var(--text1);
  }
  .icon-btn {
    width: 44px; height: 44px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card); color: var(--text1); border: 1px solid var(--border-dark);
    box-shadow: 0 3px 6px var(--shadow); list-style: none;
  }
  summary.icon-btn { cursor: pointer; }
  summary::-webkit-details-marker { display: none; }

  /* ── Menus (header overflow and row options) ── */
  details.menu { position: relative; flex: none; }
  details.menu > summary { list-style: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 232px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.20); padding: 6px; text-align: left;
  }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px;
    padding: 10px 12px; border: 0; border-radius: 10px; background: transparent;
    font-size: 16px; font-weight: 500; color: var(--text1); text-align: left;
  }
  .menu-item .ic { color: var(--text3); }
  .menu-item.danger, .menu-item.danger .ic { color: var(--red); }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .menu-account { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; }
  .menu-account-text { min-width: 0; }
  .menu-account img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .menu-account-name { font-size: 14px; font-weight: 600; color: var(--text1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-account-sub { font-size: 12px; color: var(--text3); }

  /* ── Section picker ── */
  .picker {
    display: flex; gap: 4px; padding: 4px; margin-top: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  }
  .picker-btn {
    flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: 999px; background: transparent;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 600; color: var(--text2); white-space: nowrap;
  }
  .picker-btn.active { background: var(--accent-dark); color: #fff; }

  /* ── Scrolling content ── */
  .content {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    /* The bottom clearance is deliberate: on Netlify's free plan a hosting
       badge is pinned to the bottom-right corner, and the last row has to be
       able to scroll clear of it. */
    padding: 18px max(20px, env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .stack { display: flex; flex-direction: column; gap: 22px; }

  /* ── Notices and banners ── */
  .notice {
    padding: 12px 14px; border-radius: 16px; background: var(--notice-bg); color: var(--notice-text);
    border: 1px solid var(--notice-border); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere;
  }
  .notice .btn { margin: 8px 8px 0 0; }
  .banner {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; text-align: left;
    background: var(--accent-light); color: var(--accent-text);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 16px;
  }
  .banner-body { flex: 1; min-width: 0; }
  .banner-title { display: block; font-size: 15px; font-weight: 600; }
  .banner-sub { display: block; font-size: 13px; opacity: .85; margin-top: 1px; }

  /* ── Hero card ── */
  .hero {
    /* Fills sit on a saturated gradient here, so the status colours switch to
       the bright variants iOS uses on its card. */
    --sage: var(--mint); --amber: var(--amber-bright); --red: var(--red-bright);
    background: var(--hero); color: #fff; border-radius: 24px; padding: 22px;
    box-shadow: 0 10px 22px var(--hero-glow);
    display: flex; flex-direction: column; gap: 20px;
  }
  .hero-top { display: flex; align-items: flex-start; gap: 12px; }
  .hero-headline { flex: 1; min-width: 0; }
  .hero-kicker { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero-caption { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; color: rgba(255,255,255,0.80); text-transform: uppercase; }
  .hero-amount {
    font: 700 clamp(34px, 11.5vw, 44px)/1.08 var(--font-round); letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere;
  }
  .hero-edit {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.96); color: var(--accent-dark);
    box-shadow: 0 4px 8px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) { .hero-edit { color: rgb(40,48,43); } }
  .hero-meter { display: flex; flex-direction: column; gap: 9px; }
  .hero-track { position: relative; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.16); }
  .hero-fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; max-width: 100%; }
  .hero-pace { position: absolute; top: -4px; width: 2px; height: 16px; background: rgba(255,255,255,0.92); border-radius: 1px; margin-left: -1px; }
  .hero-labels { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }
  .hero-text { font-size: 13px; font-weight: 500; line-height: 1.4; color: rgba(255,255,255,0.85); }
  .hero-divider { height: 1px; background: rgba(255,255,255,0.16); }
  .hero-foot { display: flex; align-items: center; gap: 14px; }
  .hero-foot-main { flex: 1; min-width: 0; }
  .hero-foot-label { font-size: 12px; color: rgba(255,255,255,0.80); }
  .hero-foot-value { font: 700 17px/1.25 var(--font-round); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .hero-status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.92); text-align: right; }
  .hero-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hero-editor { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.20); border-radius: 16px; padding: 14px; }
  .hero-editor-row { display: flex; align-items: center; gap: 8px; }
  .hero-editor-row .currency { font: 700 20px var(--font-round); color: rgba(255,255,255,0.9); }
  .hero .hero-editor input[type=text] {
    flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 12px; border: 0; outline: none;
    background: rgba(255,255,255,0.96); color: rgb(18,31,24); font: 700 18px var(--font-round);
  }
  .hero-editor .btn-light {
    height: 44px; padding: 0 18px; border: 0; border-radius: 999px;
    background: rgba(255,255,255,0.96); color: rgb(18,31,24); font-size: 15px; font-weight: 600;
  }
  .hero-editor .btn-ghost {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: rgba(255,255,255,0.14); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hero-editor-help { margin-top: 10px; font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.85); }
  .hero-editor .notice { margin-top: 10px; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 10px 18px; border-radius: 999px;
    font-size: 16px; font-weight: 600; border: 1px solid var(--border); background: var(--card); color: var(--text1);
    text-decoration: none;
  }
  .btn-primary { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .btn-tint { color: var(--accent-text); }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-danger-text { color: var(--red); }
  .btn-small { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .actions { display: flex; gap: 12px; }
  .actions .btn { flex: 1; min-width: 0; min-height: 52px; padding: 10px 12px; font-size: clamp(15px, 4.3vw, 17px); white-space: nowrap; box-shadow: 0 3px 8px var(--shadow); }
  .actions-minor { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -8px; }

  /* ── Section headings ── */
  .section { display: flex; flex-direction: column; gap: 10px; }
  .section-head { display: flex; align-items: baseline; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; color: inherit; }
  .section-title { font-size: 20px; font-weight: 700; color: var(--text1); }
  .section-detail { font-size: 15px; color: var(--text3); font-variant-numeric: tabular-nums; }
  .section-head .spacer { flex: 1; }
  .section-head .ic { align-self: center; color: var(--text3); transition: transform .2s ease; }
  .section-head.open .ic { transform: rotate(180deg); }

  /* ── Quick-add chips ── */
  .chips { display: flex; gap: 9px; overflow-x: auto; padding: 1px; margin: 0 -1px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px; max-width: 220px;
    padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
    font-size: 15px; font-weight: 500; color: var(--text1);
  }
  .chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── Rows ── */
  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 4px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: 1px; background: var(--border); }
  .row-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border: 0; background: transparent; text-align: left; color: inherit;
  }
  .avatar {
    width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--card-soft);
    display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1;
  }
  .row-text { flex: 1; min-width: 0; display: block; }
  .row-title { display: block; font-size: 17px; font-weight: 600; color: var(--text1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { display: block; font-size: 13px; color: var(--text3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub.wrap { white-space: normal; }
  .row-sub.over { color: var(--red); }
  .row-amount { flex: none; font: 700 15px var(--font-round); font-variant-numeric: tabular-nums; color: var(--text1); padding-left: 6px; }
  .row-amount.good, .tag-good { color: var(--sage-text); }
  .row-amount.top { align-self: flex-start; padding-top: 2px; }
  .row-sub.breakdown { margin-top: 6px; line-height: 1.5; }
  .season-delete { margin-top: 10px; }
  .tag-accent { color: var(--accent-text); }
  .row-chevron { display: flex; flex: none; color: var(--text3); margin-left: 2px; }
  .row-more {
    width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text3);
    border-radius: 12px;
  }
  .mini-track { display: block; height: 4px; border-radius: 99px; background: var(--track); margin-top: 7px; overflow: hidden; }
  .mini-fill { display: block; height: 100%; border-radius: 99px; background: var(--accent); max-width: 100%; }
  .mini-fill.over { background: var(--red); }

  /* ── Empty states ── */
  .empty { text-align: center; padding: 26px 16px 10px; }
  .empty .ic { margin: 0 auto 12px; color: var(--text3); }
  .empty-title { font-size: 20px; font-weight: 700; color: var(--text1); }
  .empty-text { font-size: 15px; color: var(--text3); margin-top: 6px; line-height: 1.4; }
  .empty.plain { padding: 18px 8px; font-size: 15px; color: var(--text3); }

  /* ── Search ── */
  .search { position: relative; }
  .search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
  .content .search input[type=text] { padding-left: 38px; }

  /* ── Forms ── */
  .input, .content input[type=text], .content input[type=date], .settings-modal input[type=text], select {
    width: 100%; min-width: 0; min-height: 46px; padding: 10px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text1);
    font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
  }
  .input:focus, .content input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  input::placeholder { color: var(--text3); opacity: 1; }
  .content input[type=date] { min-width: 0; font-size: 16px; padding-left: 10px; padding-right: 8px; }
  select {
    padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text3) 50%), linear-gradient(135deg, var(--text3) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .form-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 18px;
    box-shadow: 0 6px 18px var(--shadow); display: flex; flex-direction: column; gap: 14px;
  }
  .form-card input[type=text], .form-card input[type=date], .form-card select { background: var(--card-soft); }
  .form-title { font-size: 20px; font-weight: 700; color: var(--text1); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--text2); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field.narrow { flex: 0 0 38%; }
  .help { font-size: 13px; color: var(--text3); line-height: 1.45; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; max-width: 100%;
    border-radius: 999px; border: 1px solid var(--border); background: var(--card-soft);
    font-size: 15px; font-weight: 500; color: var(--text1);
  }
  .choice span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choice.selected { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }

<div id="app"></div>

<script src="./sprout-firebase-config.js"></script>
<script src="./sprout-firebase-config.local.js"></script>
<script type="module">
  import { toCents, fromCents, parseAmount, netSpent as sumTransactions, sumMoney, paceStatus, progress } from "./money.mjs";
  import { validDate, monthInfo, nextOccurrence, processRecurring, resetLedger, keepLedger } from "./ledger.mjs";
  import { normalizeSnapshot, exportBackup, containsHolidayData } from "./backup.mjs";
  import * as Holiday from "./holiday.mjs";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Firebase Config ──
  const firebaseConfig = window.SPROUT_FIREBASE;

  if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("REPLACE_WITH_")) {
    document.getElementById("app").innerHTML = `
      <main style="max-width: 720px; margin: 48px auto; padding: 24px; font-family: Georgia, serif; color: #3f3a34;">
        <h1 style="margin-bottom: 12px;">Sprout needs a local Firebase config</h1>
        <p style="font: 16px/1.5 system-ui, sans-serif; color: #6f675f;">
          Copy <code>sprout-firebase-config.example.js</code> to <code>sprout-firebase-config.local.js</code>
          and fill in your Firebase web app settings before loading the web prototype.
        </p>
      </main>

  }

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  // ── Default Categories ──
  const DEFAULT_PERSONAL_CATEGORIES = [
    { emoji: "🛍️", label: "Shopping" },
    { emoji: "🎁", label: "Gifts" },
    { emoji: "💄", label: "Beauty" },
    { emoji: "🍕", label: "Dining" },
    { emoji: "🚗", label: "Gas" },
  ];

  const EMOJI_OPTIONS = [
    "🛍️","🎁","💄","🍕","🚗","☕","🍔","🎬","🎮","💊",
    "🏥","✂️","🐕","🐈","🏠","🔧","📱","💻","📚","🎵",
    "✈️","🏋️","🧹","👕","👟","🎨","🌮","🍺","🍷","🧃",
    "🛒","💡","📦","🎲","🪴","🧴","💇","🎂","🎉","⛽",
    "🚌","🚕","🅿️","💰","🏦","📝","🔑","🧊","🍿","🎧",
  ];

  // ── State ──
  let state = {
    user: null,
    dataReady: false,
    writeBlocked: false,
    // Whether a preserved original is on this device. Kept separate from
    // `writeBlocked`: the download button used to be gated on the pause, so
    // anything that lifted the pause hid the only route to those bytes.
    hasRecoveryCopy: false,
    statusMessage: "",
    updatedAt: null,
    editingTransactionId: null,
    formError: "",
    budgetError: "",
    budgetInput: "",
    formRecurring: false,
    formFrequency: "monthly",
    formNextDate: "",
    pendingImport: null,
    pendingAction: null,
    canUndoImport: false,
    authLoading: true,
    authError: "",
    // "personal" | "grocery" | "holiday". Holiday is not a monthly budget, so
    // every monthly figure reads `budgetCat()` instead, which only ever answers
    // one of the two budget tabs. One stored selection, as on iOS.
    activeSection: "personal",
    groceryBudget: 400,
    personalBudget: 200,
    transactions: [],
    monthHistory: [],
    personalCategories: [...DEFAULT_PERSONAL_CATEGORIES],
    currentMonth: getCurrentMonth(),
    recurringRules: [],
    showCalendar: false,
    showForm: null, // null | "expense" | "payment"
    showReset: false,
    pendingDeleteId: null,
    showSettings: false,
    editingBudget: false,
    selectedCalDay: null,
    selectedHistoryMonthKey: null,
    formName: "",
    formAmount: "",
    formNote: "",
    formEmoji: "🛍️",
    formDate: getToday(),
    personalCarryover: 0,
    groceryCarryover: 0,
    // Emoji picker state for settings
    emojiPickerForIndex: null, // index of category being edited
    lastToast: null,
    // ── Holiday ──
    // Amounts inside these two are integer CENTS, not dollars. See the header
    // of holiday.mjs for why; every read goes through a `...Cents` helper.
    holidaySeason: Holiday.emptySeason(),
    holidaySeasonHistory: [],
    holidayForm: null,        // null | {kind:"gift"|"person"|"season", ...}
    holidayFormError: "",
    holidaySearch: "",
    txSearch: "",
    holidayDetailId: undefined, // undefined = list; null = unassigned; id = person
    showHolidaySeasons: false,
    pendingHolidayDelete: null, // {kind:"gift"|"person"|"season", id}
  };

  // ── Helpers ──
  function escapeHtml(str) {
    if (typeof str !== "string") return "";
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function getCurrentMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function getToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function editableAmount(n) {
    return new Intl.NumberFormat(navigator.language || "en-US", {useGrouping:false, maximumFractionDigits:2}).format(n);
  }
  function fmtCurrency(n) {
    return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
  }
  function fmtDate(s) {
    const d = new Date(s+"T12:00:00");
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  }
  function fmtFullDay(s) {
    const d = new Date(s+"T12:00:00");
    return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  }
  function fmtMonthYear() { return fmtMonthKey(state.currentMonth); }
  function fmtMonthKey(monthKey) {
    return new Date(`${monthKey}-01T12:00:00`).toLocaleDateString("en-US", {month:"long",year:"numeric"});
  }
  function displayedMonth() { return monthInfo(state.currentMonth, getToday()); }
  function getDaysLeftInMonth() { return displayedMonth().daysLeft; }
  function getMonthPaceProgress() { return displayedMonth().pace; }
  /**
   * Coloured by how much of the budget is gone, matching `spendingColor` in
   * Sprout-iOS `SummaryCardView`. It used to be coloured by *pace*, which made
   * a month spent 1.01x over budget on its final day amber here and red on
   * iOS — the bar disagreed with the headline beside it. Pace is its own
   * signal now, shown as a dot and a label.
   */
  function getProgressColor(spent, budget) {
    const remaining = sumMoney(budget, -spent);
    const filled = progress(spent, budget);
    if (remaining < 0 || filled >= 1) return "var(--red)";
    if (filled >= 0.8) return "var(--amber)";
    return "var(--sage)";
  }

  function getPaceLabel(spent, budget) {
    const {day, days} = displayedMonth();
    return {
      ahead: {text: "Spending too fast", color: "var(--red)"},
      on: {text: "Spending on plan", color: "var(--amber)"},
      behind: {text: "Spending under plan", color: "var(--sage)"},
    }[paceStatus(spent, budget, day, days)];
  }


  function compareTxByDateOnly(a, b) {
    if (a.date < b.date) return -1;
    if (a.date > b.date) return 1;
    return 0;
  }
  function compareMonthKeyDesc(a, b) {
    if (a.monthKey > b.monthKey) return -1;
    if (a.monthKey < b.monthKey) return 1;
    return 0;
  }
  function getCarryover(cat) { return cat === "grocery" ? state.groceryCarryover : state.personalCarryover; }
  function getCarryoverPreview() {
    return {
      personal: Math.max(0, getRemaining("personal")),
      grocery: Math.max(0, getRemaining("grocery"))
    };
  }

  function getArchivedMonth(monthKey) {
    return state.monthHistory.find(month => month.monthKey === monthKey) || null;
  }
  function getArchivedTx(month, cat) {
    return (month?.transactions || [])
      .filter(t => t.type === cat)
      .sort(compareTxByDateOnly)
      .reverse();
  }
  function getArchivedBudget(month, cat) {
    const base = cat === "grocery" ? month.groceryBudget : month.personalBudget;
    const carry = cat === "grocery" ? month.groceryCarryover : month.personalCarryover;
    return sumMoney(base, carry);
  }
  function getArchivedNetSpent(month, cat) {
    return sumTransactions(getArchivedTx(month, cat));
  }
  function getArchivedRemaining(month, cat) {
    return sumMoney(getArchivedBudget(month, cat), -getArchivedNetSpent(month, cat));
  }


  const LOCAL_CACHE_KEY = "sprout-cache-v1";
  let saveTimer = null;
  let cloudWriteQueue = Promise.resolve();
  let authGeneration = 0;
  function queueCloudWrite(uid, snapshot, generation = authGeneration) {
    cloudWriteQueue = cloudWriteQueue.then(() => saveData(uid, snapshot, generation)).catch(() => {});
    return cloudWriteQueue;
  }
  // Holiday keys count as a signature here too, matching `backup.mjs` and iOS.
  // Without them a document whose only Sprout keys were holiday ones was
  // rejected as unrecognized and blocked saving.
  function validateStoredSnapshot(data) {
    if (!data || typeof data !== "object" || !["transactions","currentMonth","personalBudget","groceryBudget","monthHistory","recurringRules","personalCategories","holidaySeason","holidaySeasonHistory"].some(key => Object.hasOwn(data, key))) {
      throw new Error("The saved document is not a recognized Sprout ledger.");
    }
    return normalizeSnapshot(data);
  }
  function processDisplayedRecurring() {
    const today = getToday();

        state.writeBlocked = true;

  async function handleSignIn() {
    state.authError = "";

    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error("Sign-in error:", e);

      if (
        e?.code === "auth/popup-blocked" ||
        e?.code === "auth/popup-closed-by-user" ||
        e?.code === "auth/cancelled-popup-request" ||
        e?.code === "auth/operation-not-supported-in-this-environment"
      ) {
        state.authError = "Popup sign-in was blocked here. Trying redirect sign-in instead.";
        render();
        try {
          await signInWithRedirect(auth, provider);

        } catch (redirectError) {
          console.error("Redirect sign-in error:", redirectError);
          state.authError = redirectError?.message || "Popup and redirect sign-in both failed. Check the browser console for details.";
        }

        e?.code === "auth/api-key-not-valid" ||
        e?.code === "auth/invalid-api-key"

  function handleSignOut() {

    clearTimeout(saveTimer);

    state.user = null;

  // ── Actions ──

  function saveHolidayGift() {
    if (!canEdit()) return;

    }
    if (!form.recipientChosen && current.recipients.length > 0) {
      state.holidayFormError = `Choose who this ${form.isReturn ? "return" : "gift"} is for, or “${Holiday.UNASSIGNED_LABEL}”.`;

    }

      date: holidayDateToIso(form.date), isReturn: Boolean(form.isReturn),

  function saveHolidayPerson() {
    if (!canEdit()) return;

    const current = season();
    const name = form.name.trim();
    if (!name) { state.holidayFormError = "Give this person a name first."; render(); return; }
    let planned = null;
    if (form.planned.trim() !== "") {
      const cents = parseHolidayCents(form.planned);

  function confirmHolidayDelete() {

    if (state.formRecurring && (!validDate(state.formNextDate) || state.formNextDate <= state.formDate)) {
      state.formError = "The next recurring date must be after this transaction's date.";
      render(); return;
    }
    const entry = {
      id: state.editingTransactionId || newTransactionId(),
      name: state.formName.trim(), amount, note: state.formNote.trim(),
      emoji: isRefund ? "💸" : (budgetCat() === "grocery" ? "🛒" : state.formEmoji),
      date: state.formDate, type: budgetCat(), isRefund,

  function holidayImportSummary(pending) {

    const incoming = pending.snapshot.holidaySeason;
    const parts = [];
    if (incoming) {
      const gifts = Holiday.giftCount(incoming);
      const people = incoming.recipients.length;
      parts.push(`${gifts} holiday gift${gifts === 1 ? "" : "s"}`);
      if (people > 0) parts.push(`${people} ${people === 1 ? "person" : "people"}`);
    }
    const seasons = (pending.snapshot.holidaySeasonHistory || []).length;
    if (seasons > 0) parts.push(`${seasons} past season${seasons === 1 ? "" : "s"}`);
    return parts.length ? `Holiday: ${parts.join(", ")}.` : "This backup has no holiday data.";

  function holidayReplacementWarning() {
    const current = season();
    const gifts = Holiday.giftCount(current);
    const people = current.recipients.length;
    const seasons = state.holidaySeasonHistory.length;
    if (!gifts && !people && !seasons && !Holiday.seasonHasBudget(current)) return "";
    const parts = [];
    if (gifts || people || Holiday.seasonHasBudget(current)) {
      const inner = [];
      if (gifts) inner.push(`${gifts} gift${gifts === 1 ? "" : "s"}`);
      if (people) inner.push(`${people} ${people === 1 ? "person" : "people"}`);
      parts.push(inner.length ? `${current.label} (${inner.join(", ")})` : current.label);

  async function previewImport(file) {

    const uid = state.user.uid;

      if (file.size > 10 * 1024 * 1024) throw new Error("Choose a JSON backup smaller than 10 MB.");
      const raw = JSON.parse(await file.text());
      const {snapshot} = normalizeSnapshot(raw, {strict:true});
      if (state.user?.uid !== uid || generation !== authGeneration) return;
      // Kept from the raw payload: the normalized snapshot turns an absent
      // holiday section into an empty season, which looks identical to a real
      // season nobody has shopped for yet.
      state.pendingImport = {snapshot, uid, generation, hasHoliday: containsHolidayData(raw)};

  function confirmImport() {

      const key = cacheKeyForUser(pending.uid);
      const raw = localStorage.getItem(key);
      if (state.writeBlocked && raw) preserveRecovery(pending.uid, raw);
      // Complete both durable writes before changing live state or scheduling cloud writes.
      localStorage.setItem(`${key}:before-import`, JSON.stringify(stateSnapshot()));
      // Undo has to restore the *pause* as well as the data. What goes into the
      // safety copy is the already-salvaged ledger, which re-normalizes without
      // a single warning, so nothing in the restored data can tell `undoImport`
      // that rows were lost and saving was paused.
      try { localStorage.setItem(`${key}:before-import-blocked`, state.writeBlocked ? "1" : ""); } catch {}
      localStorage.setItem(key, JSON.stringify(replacement));

  function undoImport() {
    if (!state.user) return;

      const key = cacheKeyForUser(state.user.uid);
      const raw = localStorage.getItem(`${key}:before-import`);
      if (!raw) throw new Error("The safety copy is unavailable.");
      const {snapshot} = normalizeSnapshot(JSON.parse(raw), {strict:true});
      let wasBlocked = false;
      try { wasBlocked = localStorage.getItem(`${key}:before-import-blocked`) === "1"; } catch {}
      snapshot.updatedAt = nextUpdateTimestamp();
      localStorage.setItem(key, JSON.stringify(snapshot));
      clearTimeout(saveTimer); authGeneration++; state.writeBlocked = false;
      applyPersistedData(snapshot);

      // salvaged ledger save freely — the dropped rows then went for good — and
      // hid the "Download original device save" button, which was gated on the
      // pause, so the preserved bytes became unreachable from the app.
      if (wasBlocked) state.writeBlocked = true;
