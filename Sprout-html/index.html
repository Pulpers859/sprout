    // and leaving it out put two fixed, full-screen dialogs on screen at once
    // with focus landing in the one underneath.
    const holidayModalsFree = !state.pendingImport && !state.pendingAction
      && !state.showSettings && !state.pendingDeleteId && !state.showReset
      && state.emojiPickerForIndex === null;
    if (state.pendingHolidayDelete && holidayModalsFree) {
      html += renderHolidayDeleteModal();
    } else if (state.showHolidaySeasons && holidayModalsFree) {
      html += renderHolidaySeasonsModal();
    }

    // Header
    html += renderHeader(onHoliday);

    // Content
    html += `<div class="content"><div class="stack">`;
    if (state.statusMessage) html += `<div class="notice" role="status">${escapeHtml(state.statusMessage)}</div>`;
    if (state.writeBlocked || state.hasRecoveryCopy) {
      html += `<div class="notice">`;
      if (state.writeBlocked) html += `<div>Import a valid backup in Settings to resume saving.</div>`;
      if (state.writeBlocked) html += `<button class="btn btn-small" id="recoveryExport">Export recovered data</button>`;
      html += `<button class="btn btn-small" id="recoveryOriginal">Download original device save</button>`;
      html += `</div>`;
    }
    // Only on a budget tab: starting a new month is a budget-tab action, and
    // the holiday tab has no month to close. Tappable, as the iOS banner is —
    // this used to be a passive notice pointing at a button elsewhere.
    if (!onHoliday && viewingClosedMonth) {
      const behind = state.currentMonth < getCurrentMonth();
      html += `<button class="banner" id="monthBanner">
        ${icon("sparkles", 20)}
        <span class="banner-body">
          <span class="banner-title">${behind ? `${escapeHtml(fmtMonthYear())} is still open` : `Showing ${escapeHtml(fmtMonthYear())}`}</span>
          <span class="banner-sub">${behind ? `These transactions still belong to ${escapeHtml(fmtMonthYear())}. Tap to close it out.` : "The saved month is ahead of this device's date. Tap to review."}</span>
        </span>
        ${icon("chevronRight", 16)}
      </button>`;
    }

    if (onHoliday) {
      html += renderHolidayBody();
      html += `</div></div>`;
      return finishRender(app, html);
    }

    // Summary card. Same layout as Sprout-iOS `SummaryCardView`: the balance
    // is the headline, the bar and its pace marker sit under it, and the
    // per-day figure and the pace verdict share the bottom row.
    const carryover = getCarryover(cat);
    const monthLabel = escapeHtml(fmtMonthYear());
    let footLabel, footValue;
    if (viewingClosedMonth) {
      footLabel = remaining < 0 ? `${monthLabel} is over budget` : `Unspent in ${monthLabel}`;
      footValue = fmtCurrency(Math.abs(remaining));
    } else {
      footLabel = dailyAllowance < 0 ? "Daily overage" : `Daily allowance · ${daysLeft} day${daysLeft === 1 ? "" : "s"} left`;
      footValue = `${fmtCurrency(Math.abs(dailyAllowance))}/day`;
    }
    html += `<div class="hero">
      <div class="hero-top">
        <div class="hero-headline">
          <div class="hero-caption">${remaining < 0 ? "Over budget" : "Available"}</div>
          <div class="hero-amount">${fmtCurrency(Math.abs(remaining))}</div>
        </div>
        ${state.editingBudget ? "" : `<button class="hero-edit" id="budgetEdit" aria-label="Edit ${cat} budget">${icon("pencil", 18)}</button>`}
      </div>`;
    if (state.editingBudget) {
      html += `<div class="hero-editor">
        <div class="hero-editor-row">
          <span class="currency">$</span>
          <input type="text" inputmode="decimal" aria-label="Monthly budget" id="budgetInput" value="${escapeHtml(state.budgetInput)}">
          <button class="btn-light" id="budgetSave">Set</button>
          <button class="btn-ghost" id="budgetCancel" aria-label="Cancel">${icon("x", 18)}</button>
        </div>
        <div class="hero-editor-help">Your recurring monthly budget. Carryover is added separately.</div>
        ${state.budgetError ? `<div class="notice" role="alert">${escapeHtml(state.budgetError)}</div>` : ""}
      </div>`;
    }
    html += `<div class="hero-meter">
        <div class="hero-track" role="img" aria-label="Budget progress: ${Math.round(pct * 100)} percent spent">
          <div class="hero-fill" style="width:${pct*100}%;background:${barColor}"></div>
          <div class="hero-pace" style="left:${pacePct*100}%"></div>
        </div>
        <div class="hero-labels">
          <span>${spent < 0 ? `${fmtCurrency(-spent)} net payments` : `${fmtCurrency(spent)} spent`}</span>
          <span>of ${fmtCurrency(budget)}</span>
        </div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-foot">
        <div class="hero-foot-main">
          <div class="hero-foot-label">${footLabel}</div>
          <div class="hero-foot-value">${footValue}</div>
        </div>
        <div class="hero-status"><span class="hero-dot" style="background:${pace.color}"></span>${pace.text}</div>
      </div>
      ${carryover > 0 ? `<div class="hero-text">${fmtCurrency(carryover)} carried over, on top of the ${fmtCurrency(getBaseBudget(cat))} monthly budget</div>` : ""}
    </div>`;

    // Actions, then one-tap repeats of recent purchases.
    if (!state.showForm) {
      html += `<div class="actions">
        <button class="btn btn-primary" id="addExpense">${icon("plus")} Add expense</button>
        <button class="btn btn-tint" id="addPayment">${icon("undo")} Payment</button>
      </div>`;
      const recent = getRecent(cat);
      if (recent.length) {
        html += `<div class="section"><div class="section-head"><span class="section-title">Repeat</span><span class="section-detail">Recent purchases</span></div><div class="chips">`;
        recent.forEach(r => {
          html += `<button class="chip" data-quickname="${escapeHtml(r.name)}" data-quickemoji="${escapeHtml(r.emoji)}"><span>${escapeHtml(r.emoji)}</span><span>${escapeHtml(r.name)}</span></button>`;
        });
        html += `</div></div>`;
      }
    }

    // Add form
    if (state.showForm === "expense") {
      html += renderAddForm(false, cat);
    } else if (state.showForm === "payment") {
      html += renderAddForm(true, cat);
    }

    // Calendar, behind its own heading.
    html += `<div class="section">
      <button class="section-head${state.showCalendar ? " open" : ""}" id="calToggle" aria-expanded="${state.showCalendar ? "true" : "false"}">
        <span class="section-title">This month</span><span class="section-detail">${monthLabel}</span><span class="spacer"></span>${icon("chevronDown", 18)}
      </button>
      ${state.showCalendar ? renderCalendar(cat) : ""}
    </div>`;

    // Transaction list. The search field appears at five or more rows and the
    // filter is inert whenever its control is off screen — otherwise deleting
    // down to four leaves "No transactions match" with no box to clear.
    const txSearchable = txs.length >= 5;
    const txQuery = txSearchable ? state.txSearch.trim() : "";
    const matching = txQuery
      ? txs.filter(t => t.name.toLowerCase().includes(txQuery.toLowerCase())
          || (t.note || "").toLowerCase().includes(txQuery.toLowerCase()))
      : txs;

    html += `<div class="section"><div class="section-head"><span class="section-title">Transactions</span><span class="section-detail">${txQuery ? `${matching.length} of ${txs.length}` : txs.length}</span></div>`;
    if (txSearchable) {
      html += `<div class="search">${icon("search", 16)}<input type="text" id="txSearch" aria-label="Search transactions" placeholder="Search transactions" value="${escapeHtml(state.txSearch)}"></div>`;
    }
    if (txs.length === 0) {
      html += `<div class="empty">${icon("list", 40)}<div class="empty-title">No transactions yet</div><div class="empty-text">Add your first ${cat} expense to start tracking this month.</div></div>`;
    } else if (matching.length === 0) {
      html += `<div class="empty plain">No transactions match “${escapeHtml(txQuery)}”</div>`;
    } else {
      html += `<div class="list">`;
      [...matching].reverse().forEach(t => {
        html += `<div class="row">
          <div class="row-main">
            <div class="avatar">${t.isRefund ? "💸" : escapeHtml(t.emoji)}</div>
            <div class="row-text">
              <div class="row-title">${escapeHtml(t.name)}</div>
              <div class="row-sub">${fmtDate(t.date)}${t.isRefund ? ' · <span class="tag-good">payment</span>' : ''}${t.note ? " · " + escapeHtml(t.note) : ""}</div>
            </div>
            <div class="row-amount${t.isRefund ? " good" : ""}">${t.isRefund ? "+" : "−"}${fmtCurrency(t.amount)}</div>
          </div>
          ${rowMenu(`Options for ${t.name}`, `<button class="menu-item" data-editid="${escapeHtml(t.id)}">${icon("pencil")} Edit transaction</button><button class="menu-item danger" data-txid="${escapeHtml(t.id)}">${icon("trash")} Remove transaction</button>`)}
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`; // close the transactions section

    html += `</div></div>`; // close content
    return finishRender(app, html);
  }

  /** Shared by both section branches: preserves focus, selection and scroll
   * across the full re-render, then rebinds. */
  function finishRender(app, html) {
    const activeId = document.activeElement?.id || null;
    const selStart = document.activeElement?.selectionStart;
    const selEnd = document.activeElement?.selectionEnd;
    const scrollTop = document.querySelector('.content')?.scrollTop || 0;

    // A form that has just appeared has to be in view: "Edit" on a row far down
    // the list opened it near the top of the page, off screen.
    const hadForm = Boolean(document.querySelector('.form-card'));

    // One wrapper carries the active section, which is what every accent
    // colour on the page keys off.
    app.innerHTML = `<div class="shell" data-section="${escapeHtml(state.activeSection)}">${html}</div>`;
    const overlay = document.querySelector(".emoji-grid-overlay") || document.querySelector(".modal-overlay");
    if (overlay) document.querySelectorAll(".header,.content").forEach(el => { el.inert = true; });
    bindEvents();

    if (activeId) {
      const el = document.getElementById(activeId);
      if (el) {
        el.focus();
        if (typeof selStart === 'number' && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selEnd); } catch {}
        }
      }
    }
    if (overlay && !overlay.contains(document.activeElement)) overlay.querySelector("button,input,select")?.focus();
    const content = document.querySelector('.content');
    if (content) content.scrollTop = scrollTop;
    const form = document.querySelector('.form-card');
    if (form && !hadForm) form.scrollIntoView({ block: "nearest" });
  }

  // ── Holiday rendering ──
  function renderHolidayBody() {
    if (state.holidayDetailId !== undefined) return renderHolidayDetail();
    return renderHolidaySummary() + renderHolidayActions() + renderHolidayForm()
      + renderHolidayPeople() + renderHolidayUnassigned() + renderHolidayGifts();
  }

  function renderHolidaySummary() {
    const current = season();
    const hasBudget = Holiday.seasonHasBudget(current);
    const spent = Holiday.seasonSpentCents(current);
    const remaining = Holiday.seasonRemainingCents(current);
    const pct = Holiday.seasonProgress(current);
    const barColor = getProgressColor(fromCents(spent), fromCents(current.budget));
    const planning = holidayPlanningFigure();
    const tally = escapeHtml(holidayTallyText());

    // Same card as Sprout-iOS `HolidaySummaryCardView`. The season name is its
    // own line above the label, because a custom name crammed in beside
    // "AVAILABLE" shrank both to nothing.
    let h = `<div class="hero">
      <div class="hero-top">
        <div class="hero-headline">
          <div class="hero-kicker">${escapeHtml(current.label)}</div>
          <div class="hero-caption">${!hasBudget ? "Spent so far" : remaining < 0 ? "Over budget" : "Available"}</div>
          <div class="hero-amount">${holidayMoney(hasBudget ? Math.abs(remaining) : spent)}</div>
        </div>
        ${state.editingBudget ? "" : `<button class="hero-edit" id="holidayBudgetEdit" aria-label="${hasBudget ? "Edit holiday budget" : "Set holiday budget"}">${icon("pencil", 18)}</button>`}
      </div>`;

    if (state.editingBudget) {
      h += `<div class="hero-editor">
        <div class="hero-editor-row">
          <span class="currency">$</span>
          <input type="text" inputmode="decimal" aria-label="Holiday budget" id="holidayBudgetInput" value="${escapeHtml(state.budgetInput)}">
          <button class="btn-light" id="holidayBudgetSave">Set</button>
          <button class="btn-ghost" id="holidayBudgetCancel" aria-label="Cancel">${icon("x", 18)}</button>
        </div>
        <div class="hero-editor-help">What you plan to spend on gifts this season. Kept entirely separate from your Personal and Grocery budgets. Set it to 0 to clear it.</div>
        ${state.budgetError ? `<div class="notice" role="alert">${escapeHtml(state.budgetError)}</div>` : ""}
      </div>`;
    }

    if (hasBudget) {
      h += `<div class="hero-meter">
        <div class="hero-track" role="img" aria-label="Holiday budget progress: ${Math.round(pct * 100)} percent spent">
          <div class="hero-fill" style="width:${pct*100}%;background:${barColor}"></div>
        </div>
        <div class="hero-labels">
          <span>${spent < 0 ? `${holidayMoney(-spent)} net returned` : `${holidayMoney(spent)} spent`}</span>
          <span>of ${holidayMoney(current.budget)}</span>
        </div>
      </div>`;
    } else if (!state.editingBudget) {
      // No bar, because there is nothing to fill. Saying so beats an empty
      // track that looks like a budget you have not touched.
      h += `<div class="hero-text">No holiday budget set yet. Tap the pencil to add one — it stays separate from your monthly budgets.</div>`;
    }

    h += `<div class="hero-divider"></div><div class="hero-foot">`;
    if (planning) {
      h += `<div class="hero-foot-main">
          <div class="hero-foot-label">${planning.label}</div>
          <div class="hero-foot-value">${planning.value}</div>
        </div>
        <div class="hero-status">${tally}</div>`;
    } else {
      h += `<div class="hero-status">${tally}</div>`;
    }
    return h + `</div></div>`;
  }

  /**
   * The planning figure, or nothing when there is nothing honest to put there.
   * `unreservedCents` subtracts spend, so it is always a slice of the available
   * balance rather than a rival claim about it — the monthly card once showed
   * two different figures a reader takes as "money I can still commit". Hidden
   * once the budget is gone, and when nobody has a target, where it would only
   * restate the tally beside it.
   */
  function holidayPlanningFigure() {
    const current = season();
    if (!Holiday.seasonHasBudget(current) || !Holiday.hasPerPersonTargets(current)) return null;
    if (Holiday.seasonRemainingCents(current) < 0) return null;
    const unreserved = Holiday.unreservedCents(current);
    return {
      label: unreserved < 0 ? "Targets exceed what's left by" : "Left to plan",
      value: holidayMoney(Math.abs(unreserved)),
    };
  }

  /** Counts gifts, not rows: a return is money coming back, not something bought. */
  function holidayTallyText() {
    const current = season();
    const gifts = Holiday.giftCount(current);
    const returns = Holiday.returnCount(current);
    const people = current.recipients.length;
    const parts = [`${gifts} gift${gifts === 1 ? "" : "s"}`];
    if (returns > 0) parts.push(`${returns} return${returns === 1 ? "" : "s"}`);
    if (people > 0) parts.push(`${people} ${people === 1 ? "person" : "people"}`);
    return parts.join(" · ");
  }

  function renderHolidayActions() {
    if (state.holidayForm) return "";
    const atLimit = season().recipients.length >= Holiday.RECIPIENT_LIMIT;
    // Two actions, as on iOS. Renaming, starting a new season, recording a
    // return and past seasons are in the "…" menu in the header.
    return `<div class="actions">
      <button class="btn btn-primary" id="holidayAddGift">${icon("plus")} Add gift</button>
      <button class="btn btn-tint" id="holidayAddPerson"${atLimit ? " disabled" : ""}>${icon("userPlus")} Add person</button>
    </div>`;
  }

  function renderHolidayForm() {
    const form = state.holidayForm;
    if (!form) return "";
    if (form.kind === "person") return renderHolidayPersonForm(form);
    if (form.kind === "rename") return renderHolidayRenameForm(form);
    if (form.kind === "season") return renderHolidaySeasonForm(form);
    return renderHolidayGiftForm(form);
  }

  function renderHolidayGiftForm(form) {
    const current = season();
    const editing = Boolean(form.id);
    const chips = [{ id: null, name: Holiday.UNASSIGNED_LABEL, emoji: "🎁" }]
      .concat(Holiday.recipientsInDisplayOrder(current));
    // "Not for one person" is first, not last: on iOS it sat after every person
    // in a scrolling row, so it was usually off screen while being the selected
    // option, and a gift saved straight away was filed against nobody.
    const picked = form.recipientChosen;
    let h = `<div class="form-card">
      <div class="form-title">${editing ? (form.isReturn ? "Edit return" : "Edit gift") : (form.isReturn ? "Record a return" : "Add gift")}</div>
      <div class="field-row">
        <label class="field"><span class="field-label">${form.isReturn ? "What did you return?" : "What did you buy?"}</span>
          <input type="text" id="holidayGiftName" placeholder="${form.isReturn ? "Sweater, duplicate toy…" : "Scarf, book, toy…"}" value="${escapeHtml(form.name)}"></label>
        <label class="field narrow"><span class="field-label">Amount</span>
          <input type="text" id="holidayGiftAmount" inputmode="decimal" placeholder="0.00" value="${escapeHtml(form.amount)}"></label>
      </div>
      <div class="field-row">
        <label class="field"><span class="field-label">Note</span>
          <input type="text" id="holidayGiftNote" placeholder="Optional" value="${escapeHtml(form.note)}"></label>
        <label class="field"><span class="field-label">Date</span>
          <input type="date" id="holidayGiftDate" value="${escapeHtml(form.date)}"></label>
      </div>
      <div class="field"><span class="field-label">Who it's for</span>
      <div class="choices">`;
    chips.forEach(person => {
      const selected = picked && (form.recipientID ?? null) === (person.id ?? null);
      h += `<button class="choice${selected ? " selected" : ""}" data-holidaypick="${person.id === null ? "" : escapeHtml(person.id)}" aria-pressed="${selected ? "true" : "false"}"><span>${escapeHtml(person.emoji)} ${escapeHtml(person.name)}</span></button>`;
    });
    h += `</div></div>
      <div class="help">${form.isReturn ? "Comes back off your holiday budget only." : "Counted against your holiday budget only."}${current.recipients.length === 0 ? " Add a person to track who each gift is for." : (picked ? "" : " Pick a person, or “" + Holiday.UNASSIGNED_LABEL + "”.")}</div>`;
    if (state.holidayFormError) h += `<div class="notice" role="alert">${escapeHtml(state.holidayFormError)}</div>`;
    h += `<div class="form-actions">
        <button class="btn" id="holidayFormCancel">Cancel</button>
        <button class="btn btn-primary" id="holidayGiftSave">${editing ? "Save changes" : (form.isReturn ? "Save return" : "Save gift")}</button>
      </div></div>`;
    return h;
  }

  function renderHolidayPersonForm(form) {
    const editing = Boolean(form.id);
    let h = `<div class="form-card">
      <div class="form-title">${editing ? "Edit person" : "Add person"}</div>
      <div class="field-row">
        <label class="field"><span class="field-label">Name</span>
          <input type="text" id="holidayPersonName" placeholder="Mom, Dad, Sam…" value="${escapeHtml(form.name)}"></label>
        <label class="field narrow"><span class="field-label">Target</span>
          <input type="text" id="holidayPersonPlanned" inputmode="decimal" placeholder="No target" value="${escapeHtml(form.planned)}"></label>
      </div>
      <div class="field"><span class="field-label">Icon</span>
      <div class="choices">`;
    Holiday.RECIPIENT_EMOJI_OPTIONS.forEach(emoji => {
      const selected = form.emoji === emoji;
      h += `<button class="choice icon-only${selected ? " selected" : ""}" data-holidayemoji="${escapeHtml(emoji)}" aria-pressed="${selected ? "true" : "false"}">${escapeHtml(emoji)}</button>`;
    });
    h += `</div></div>
      <div class="help">Leave the target empty if you don't want a per-person figure. It only affects “Left to plan” — gifts always count against the holiday budget.</div>`;
    if (state.holidayFormError) h += `<div class="notice" role="alert">${escapeHtml(state.holidayFormError)}</div>`;
    h += `<div class="form-actions">
        <button class="btn" id="holidayFormCancel">Cancel</button>
        <button class="btn btn-primary" id="holidayPersonSave">${editing ? "Save changes" : "Add person"}</button>
      </div></div>`;
    return h;
  }

  /** iOS has "Rename this season"; without it on web a typo in the label can
   * only be fixed by archiving the season, and a label that arrived from a sync
   * cannot be cleaned up through the UI at all. */
  function renderHolidayRenameForm(form) {
    let h = `<div class="form-card">
      <div class="form-title">Rename season</div>
      <label class="field"><span class="field-label">Season name</span>
        <input type="text" id="holidayRenameName" placeholder="${escapeHtml(season().label)}" value="${escapeHtml(form.label)}"></label>`;
    if (state.holidayFormError) h += `<div class="notice" role="alert">${escapeHtml(state.holidayFormError)}</div>`;
    return h + `<div class="form-actions">
        <button class="btn" id="holidayFormCancel">Cancel</button>
        <button class="btn btn-primary" id="holidayRenameSave">Save name</button>
      </div></div>`;
  }

  function renderHolidaySeasonForm(form) {
    const current = season();
    const gifts = Holiday.giftCount(current);
    const people = current.recipients.length;
    const archived = state.holidaySeasonHistory.length;
    let h = `<div class="form-card">
      <div class="form-title">Start a new season</div>
      <label class="field"><span class="field-label">Season name</span>
        <input type="text" id="holidaySeasonName" placeholder="${escapeHtml(Holiday.defaultSeasonLabel())}" value="${escapeHtml(form.label)}"></label>
      <div class="help">Leave it empty to use “${escapeHtml(Holiday.defaultSeasonLabel())}”.</div>
      <label class="check-row">
        <input type="checkbox" id="holidayCarry"${form.carry ? " checked" : ""}${people === 0 ? " disabled" : ""}>
        <span>Keep the same people${people === 0 ? " — none on the list yet" : ` (${people} ${people === 1 ? "person" : "people"} and their targets, without their gifts)`}</span>
      </label>
      <div class="help">
        · ${escapeHtml(current.label)} moves to your past seasons${gifts === 0 ? "." : ` with its ${gifts} gift${gifts === 1 ? "" : "s"}.`}<br>
        · ${current.budget > 0 ? `Your ${holidayMoney(current.budget)} holiday budget carries over — you can change it afterwards.` : "The new season starts with no budget set."}<br>
        · Sprout keeps your ${Holiday.HISTORY_LIMIT} most recent seasons${archived >= Holiday.HISTORY_LIMIT ? ", so the oldest one will be dropped." : "."}<br>
        · Your monthly budgets are not affected.
      </div>`;
    if (state.holidayFormError) h += `<div class="notice" role="alert">${escapeHtml(state.holidayFormError)}</div>`;
    h += `<div class="form-actions">
        <button class="btn" id="holidayFormCancel">Cancel</button>
        <button class="btn btn-primary" id="holidaySeasonSave">Start new season</button>
      </div></div>`;
    return h;
  }

  function renderHolidayPeople() {
    const current = season();
    const people = Holiday.recipientsInDisplayOrder(current);
    let h = `<div class="section"><div class="section-head"><span class="section-title">People</span><span class="section-detail">${people.length}</span></div>`;
    // Gated on the people list alone: requiring zero unassigned gifts too meant
    // logging one gift with nobody added flipped this to "People 0" and took
    // away the only instruction for adding people exactly when it was needed.
    if (people.length === 0) {
      return h + `<div class="empty">${icon("users", 40)}<div class="empty-title">No one on the list yet</div><div class="empty-text">Add the people you're buying for, then log each gift as you buy it.</div></div></div>`;
    }
    h += `<div class="list">`;
    people.forEach(person => {
      h += renderHolidayPersonRow(person);
    });
    return h + `</div></div>`;
  }

  function renderHolidayPersonRow(person) {
    const current = season();
    const tally = Holiday.recipientTally(current, person.id);
    const fraction = Holiday.recipientProgress(current, person);
    const planned = person.plannedAmount;
    const over = planned != null && tally.spentCents > planned;
    let sub;
    if (planned == null) {
      const parts = [`${tally.gifts} gift${tally.gifts === 1 ? "" : "s"}`];
      if (tally.returns > 0) parts.push(`${tally.returns} return${tally.returns === 1 ? "" : "s"}`);
      sub = tally.rows === 0 ? "No gifts yet" : parts.join(" · ");
    } else if (over) {
      sub = `${holidayMoney(tally.spentCents - planned)} over ${holidayMoney(planned)} planned`;
    } else {
      sub = `${holidayMoney(planned - tally.spentCents)} left of ${holidayMoney(planned)}`;
    }
    // The whole row opens the person, as it does on iOS. Editing and removing
    // them live on that screen rather than as three links on every row.
    return `<div class="row">
      <button class="row-main" data-holidayopen="${escapeHtml(person.id)}">
        <span class="avatar">${escapeHtml(person.emoji)}</span>
        <span class="row-text">
          <span class="row-title">${escapeHtml(person.name)}</span>
          <span class="row-sub wrap${over ? " over" : ""}">${escapeHtml(sub)}</span>
          ${fraction === null ? "" : `<span class="mini-track"><span class="mini-fill${over ? " over" : ""}" style="width:${fraction*100}%"></span></span>`}
        </span>
        <span class="row-amount">${holidayMoney(tally.spentCents)}</span>
        <span class="row-chevron">${icon("chevronRight", 18)}</span>
      </button>
    </div>`;
  }

  /** Rows that belong to no one — deliberately, or because their person was
   * removed. Its own section, because it is not a person and must not be
   * counted under "People". */
  function renderHolidayUnassigned() {
    const current = season();
    const tally = Holiday.recipientTally(current, null);
    if (tally.rows === 0) return "";
    return `<div class="section"><div class="section-head"><span class="section-title">Not assigned to a person</span><span class="section-detail">${tally.rows}</span></div>
      <div class="list"><div class="row">
        <button class="row-main" data-holidayopen="">
          <span class="avatar">🎁</span>
          <span class="row-text">
            <span class="row-title">${escapeHtml(Holiday.UNASSIGNED_LABEL)}</span>
            <span class="row-sub">${tally.gifts} gift${tally.gifts === 1 ? "" : "s"}${tally.returns > 0 ? ` · ${tally.returns} return${tally.returns === 1 ? "" : "s"}` : ""}</span>
          </span>
          <span class="row-amount">${holidayMoney(tally.spentCents)}</span>
          <span class="row-chevron">${icon("chevronRight", 18)}</span>
        </button>
      </div></div></div>`;
  }

  function holidayGiftMatches(purchase, query) {
    const current = season();
    const person = Holiday.findRecipient(current, purchase.recipientID);
    const name = person ? person.name : Holiday.UNASSIGNED_LABEL;
    const needle = query.toLowerCase();
    return purchase.name.toLowerCase().includes(needle)
      || purchase.note.toLowerCase().includes(needle)
      || name.toLowerCase().includes(needle);
  }

  function renderHolidayGifts() {
    const current = season();
    const all = Holiday.purchasesNewestFirst(current);
    // Same rule as the transactions list: the field appears at five or more
    // rows and the filter is inert whenever its control is off screen.
    const searchable = all.length >= 5;
    const query = searchable ? state.holidaySearch.trim() : "";
    const rows = query ? all.filter(row => holidayGiftMatches(row, query)) : all;

    let h = `<div class="section"><div class="section-head"><span class="section-title">All gifts</span><span class="section-detail">${query ? `${rows.length} of ${all.length}` : all.length}</span></div>`;
    if (searchable) {
      h += `<div class="search">${icon("search", 16)}<input type="text" id="holidaySearch" aria-label="Search gifts or people" placeholder="Search gifts or people" value="${escapeHtml(state.holidaySearch)}"></div>`;
    }
    if (all.length === 0) {
      return h + `<div class="empty">${icon("gift", 40)}<div class="empty-title">No gifts logged yet</div><div class="empty-text">Every gift you add here counts against your holiday budget and nothing else.</div></div></div>`;
    }
    if (rows.length === 0) {
      return h + `<div class="empty plain">No gifts match “${escapeHtml(query)}”</div></div>`;
    }
    h += `<div class="list">`;
    rows.forEach(row => { h += renderHolidayGiftRow(row, true); });
    return h + `</div></div>`;
  }

  function renderHolidayGiftRow(purchase, showPerson) {
    const current = season();
    const person = Holiday.findRecipient(current, purchase.recipientID);
    const who = person ? person.name : Holiday.UNASSIGNED_LABEL;
    const meta = [];
    if (showPerson) meta.push(`<span class="tag-accent">${escapeHtml(who)}</span>`);
    meta.push(fmtDate(holidayDayValue(purchase.date)));
    if (purchase.isReturn) meta.push('<span class="tag-good">returned</span>');
    if (purchase.note) meta.push(escapeHtml(purchase.note));
    const kind = purchase.isReturn ? "return" : "gift";
    return `<div class="row">
      <div class="row-main">
        <div class="avatar">${purchase.isReturn ? "↩️" : escapeHtml(person ? person.emoji : "🎁")}</div>
        <div class="row-text">
          <div class="row-title">${escapeHtml(purchase.name)}</div>
          <div class="row-sub">${meta.join(" · ")}</div>
        </div>
        <div class="row-amount${purchase.isReturn ? " good" : ""}">${purchase.isReturn ? "+" : "−"}${holidayMoney(purchase.amount)}</div>
      </div>
      ${rowMenu(`Options for ${purchase.name}`, `<button class="menu-item" data-holidayeditgift="${escapeHtml(purchase.id)}">${icon("pencil")} Edit ${kind}</button><button class="menu-item danger" data-holidayremovegift="${escapeHtml(purchase.id)}">${icon("trash")} Remove ${kind}</button>`)}
    </div>`;
  }

  /** Everything bought for one person, or the gifts that belong to nobody.
   * Reads from the id so a rename or a deletion is reflected immediately. */
  function renderHolidayDetail() {
    const current = season();
    const id = state.holidayDetailId;
    const person = Holiday.findRecipient(current, id);
    // The person can be removed from this very view; fall back to the list
    // rather than showing an empty screen for someone who is gone.
    if (id !== null && !person) { state.holidayDetailId = undefined; return renderHolidayBody(); }
    const tally = Holiday.recipientTally(current, id);
    const rows = Holiday.purchasesFor(current, id);
    const planned = person?.plannedAmount;

    let h = `<div><button class="btn btn-small" id="holidayBack">${icon("chevronLeft", 16)} All people</button></div>
      <div class="hero">
        <div class="hero-top">
          <div class="hero-headline">
            <div class="hero-kicker">${escapeHtml(person ? person.emoji + " " + person.name : "🎁 " + Holiday.UNASSIGNED_LABEL)}</div>
            <div class="hero-caption">Spent</div>
            <div class="hero-amount">${holidayMoney(tally.spentCents)}</div>
          </div>
          ${person && !state.holidayForm ? `<button class="hero-edit" data-holidayeditperson="${escapeHtml(person.id)}" aria-label="Edit ${escapeHtml(person.name)}">${icon("pencil", 18)}</button>` : ""}
        </div>`;
    if (planned != null) {
      const left = planned - tally.spentCents;
      const fraction = Holiday.recipientProgress(current, person) ?? 0;
      h += `<div class="hero-meter">
          <div class="hero-track"><div class="hero-fill" style="width:${fraction*100}%;background:${left < 0 ? "var(--red)" : "var(--sage)"}"></div></div>
          <div class="hero-text">${left < 0
            ? `${holidayMoney(-left)} over the ${holidayMoney(planned)} planned`
            : `${holidayMoney(left)} left of the ${holidayMoney(planned)} planned`}</div>
        </div>`;
    } else {
      const parts = [`${tally.gifts} gift${tally.gifts === 1 ? "" : "s"}`];
      if (tally.returns > 0) parts.push(`${tally.returns} return${tally.returns === 1 ? "" : "s"}`);
      h += `<div class="hero-text">${tally.rows === 0 ? "No gifts yet." : parts.join(" · ") + " · no per-person target set"}</div>`;
    }
    h += `</div>`;

    if (!state.holidayForm) {
      h += `<div class="actions">
        <button class="btn btn-primary" id="holidayAddGift">${icon("plus")} Add gift</button>
        <button class="btn btn-tint" id="holidayAddReturn">${icon("undo")} Return</button>
      </div>`;
      if (person) {
        h += `<div class="actions-minor">
          <button class="btn btn-small" data-holidayeditperson="${escapeHtml(person.id)}">${icon("pencil", 15)} Edit person</button>
          <button class="btn btn-small btn-danger-text" data-holidayremoveperson="${escapeHtml(person.id)}">${icon("trash", 15)} Remove person</button>
        </div>`;
      }
    }
    h += renderHolidayForm();

    h += `<div class="section"><div class="section-head"><span class="section-title">Gifts</span><span class="section-detail">${rows.length}</span></div>`;
    if (rows.length === 0) {
      h += `<div class="empty">${icon("gift", 40)}<div class="empty-title">Nothing logged here yet</div><div class="empty-text">${person ? `Gifts you add for ${escapeHtml(person.name)} will show up here.` : "Gifts that aren't for one person will show up here."}</div></div>`;
    } else {
      // The heading already names who this list is for.
      h += `<div class="list">`;
      rows.forEach(row => { h += renderHolidayGiftRow(row, false); });
      h += `</div>`;
    }
    return h + `</div>`;
  }

  function renderHolidaySeasonsModal() {
    const history = state.holidaySeasonHistory;
    let h = `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Past holiday seasons">
      <div class="modal-title">Past seasons</div>`;
    if (history.length === 0) {
      h += `<div class="modal-text">When you start a new holiday season, Sprout keeps the one you closed here for reference.</div>`;
    } else {
      h += `<div class="modal-text">A past season can be opened or deleted, but not edited. Sprout keeps your ${Holiday.HISTORY_LIMIT} most recent.</div><div class="list">`;
      history.forEach(past => {
        const spent = Holiday.seasonSpentCents(past);
        const gifts = Holiday.giftCount(past);
        const people = past.recipients.length;
        h += `<div class="row"><div class="row-main">
          <div class="avatar">🎁</div>
          <div class="row-text">
            <div class="row-title">${escapeHtml(past.label)}</div>
            <div class="row-sub wrap">${gifts} gift${gifts === 1 ? "" : "s"}${people > 0 ? ` for ${people} ${people === 1 ? "person" : "people"}` : " saved"}${Holiday.seasonHasBudget(past) ? ` · of ${holidayMoney(past.budget)}` : " · no budget set"}</div>
            ${renderHolidaySeasonBreakdown(past)}
            <button class="btn btn-small btn-danger-text season-delete" data-holidayremoveseason="${escapeHtml(past.id)}">${icon("trash", 15)} Delete season</button>
          </div>
          <div class="row-amount top">${holidayMoney(spent)}</div>
        </div></div>`;
      });
      h += `</div>`;
    }
    h += `<div class="modal-actions"><button class="modal-btn keep" id="holidaySeasonsClose">Done</button></div>
      </div></div>`;
    return h;
  }

  /** The row above promises "N gifts for M people", and seeing what each person
   * cost is most of why a season is kept at all. */
  function renderHolidaySeasonBreakdown(past) {
    const people = Holiday.recipientsInDisplayOrder(past);
    const unassigned = Holiday.recipientTally(past, null);
    if (people.length === 0 && unassigned.rows === 0) return "";
    let h = `<div class="row-sub wrap breakdown">`;
    people.forEach(person => {
      h += `${escapeHtml(person.emoji)} ${escapeHtml(person.name)} · ${holidayMoney(Holiday.recipientTally(past, person.id).spentCents)}<br>`;
    });
    if (unassigned.rows > 0) h += `🎁 ${escapeHtml(Holiday.UNASSIGNED_LABEL)} · ${holidayMoney(unassigned.spentCents)}`;
    return h + `</div>`;
  }

  function renderHolidayDeleteModal() {
    const pending = state.pendingHolidayDelete;
    const current = season();
    let title = "Remove this?";
    let text = "";
    if (pending.kind === "gift") {
      const row = current.purchases.find(p => p.id === pending.id);
      if (!row) return "";
      title = row.isReturn ? "Remove return?" : "Remove gift?";
      text = `This ${row.isReturn ? "return" : "gift"}, ${row.name} (${holidayMoney(row.amount)}), will be removed from your holiday spending.`;
    } else if (pending.kind === "person") {
      const person = Holiday.findRecipient(current, pending.id);
      if (!person) return "";
      const tally = Holiday.recipientTally(current, person.id);
      title = "Remove person?";
      if (tally.rows === 0) {
        text = `${person.name} will be removed from your holiday list.`;
      } else {
        const items = [`${tally.gifts} gift${tally.gifts === 1 ? "" : "s"}`];
        if (tally.returns > 0) items.push(`${tally.returns} return${tally.returns === 1 ? "" : "s"}`);
        // Quotes the same tally the dashboard shows, so what the user is told
        // they are losing is exactly what leaves the total.
        text = `${person.name}, ${items.join(" and ")} totalling ${holidayMoney(tally.spentCents)}, will be removed from your holiday spending.`;
      }
    } else {
      const past = state.holidaySeasonHistory.find(h => h.id === pending.id);
      if (!past) return "";
      const gifts = Holiday.giftCount(past);
      title = "Delete this season?";
      text = `${past.label} and its ${gifts} gift${gifts === 1 ? "" : "s"} will be removed. This can't be undone.`;
    }
    return `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
      <div class="modal-title">${escapeHtml(title)}</div>
      <div class="modal-text">${escapeHtml(text)}</div>
      <div class="modal-actions">
        <button class="modal-btn keep" id="holidayDeleteCancel">Cancel</button>
        <button class="modal-btn reset danger" id="holidayDeleteConfirm">Remove</button>
      </div></div></div>`;
  }

  function renderAddForm(isPayment, cat) {
    const editing = Boolean(state.editingTransactionId);
    let h = `<div class="form-card">
      <div class="form-title">${editing ? "Edit transaction" : isPayment ? "Add payment" : "Add expense"}</div>`;

    // Category picker only for personal expenses (not payments, not grocery)
    if (!isPayment && cat === "personal") {
      h += `<div class="choices">`;
      state.personalCategories.forEach(c => {
        const selected = state.formEmoji === c.emoji;
        h += `<button class="choice${selected ? " selected" : ""}" data-emoji="${escapeHtml(c.emoji)}" aria-pressed="${selected ? "true" : "false"}"><span>${escapeHtml(c.emoji)} ${escapeHtml(c.label)}</span></button>`;
      });
      h += `</div>`;
    }

    h += `<div class="field-row">
        <label class="field"><span class="field-label">${isPayment ? "What was returned?" : "What was it?"}</span>
          <input type="text" aria-label="Transaction name" maxlength="200" placeholder="${isPayment ? "Refund, return…" : "Coffee, gas, dinner…"}" id="formName" value="${escapeHtml(state.formName)}"></label>
        <label class="field narrow"><span class="field-label">Amount</span>
          <input type="text" placeholder="0.00" inputmode="decimal" aria-label="Amount in US dollars" id="formAmount" value="${escapeHtml(state.formAmount)}"></label>
      </div>
      <div class="field-row">
        <label class="field"><span class="field-label">Note</span>
          <input type="text" aria-label="Note" maxlength="2000" placeholder="Optional" id="formNote" value="${escapeHtml(state.formNote)}"></label>
        <label class="field"><span class="field-label">Date</span>
          <input type="date" aria-label="Transaction date" id="formDate" value="${escapeHtml(state.formDate)}"></label>
      </div>`;

    if (editing) {
      h += `<label class="field"><span class="field-label">Type</span>
          <select id="formMode"><option value="expense" ${!isPayment ? "selected" : ""}>Expense</option><option value="payment" ${isPayment ? "selected" : ""}>Payment / refund</option></select></label>
        <div class="help">Editing an occurrence does not change its recurring rule.</div>`;
    } else {
      h += `<label class="check-row"><input type="checkbox" id="formRecurring" ${state.formRecurring ? "checked" : ""}><span>Repeat this transaction</span></label>`;
      if (state.formRecurring) {
        h += `<div class="field-row">
            <label class="field"><span class="field-label">Frequency</span>
              <select id="formFrequency"><option value="weekly" ${state.formFrequency === "weekly" ? "selected" : ""}>Weekly</option><option value="monthly" ${state.formFrequency === "monthly" ? "selected" : ""}>Monthly</option><option value="yearly" ${state.formFrequency === "yearly" ? "selected" : ""}>Yearly</option></select></label>
            <label class="field"><span class="field-label">Next date</span>
              <input type="date" id="formNextDate" value="${escapeHtml(state.formNextDate || "")}"></label>
          </div>
          <div class="help">Due entries are added when you open or return to Sprout.</div>`;
      }
    }
    h += `<div class="help">Amounts are in US dollars.</div>
      ${state.formError ? `<div class="notice" role="alert">${escapeHtml(state.formError)}</div>` : ""}
      <div class="form-actions">
        <button class="btn" id="formCancel">Cancel</button>
        <button class="btn btn-primary" id="formSubmit">${editing ? "Save changes" : isPayment ? "Add payment" : "Add expense"}</button>
      </div></div>`;
    return h;
  }

  function renderSettingsModal() {
    let h = `<div class="modal-overlay" id="settingsOverlay">
      <div class="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
        <div class="settings-header">
          <div class="settings-title">Settings</div>
          <button class="settings-close" id="settingsClose" aria-label="Close settings">${icon("x", 18)}</button>
        </div>
        ${state.statusMessage ? `<div class="notice" role="status">${escapeHtml(state.statusMessage)}</div>` : ""}
        <div class="settings-section-label">Backup and recovery</div>
        <div class="settings-help">Export a portable backup for web or iOS. Import replaces this account's data after confirmation. Native iOS data is transferred by backup; it is not linked to this Google account.</div>
        <div class="form-actions"><button class="btn" id="exportBackup">Export backup</button><label class="btn file-btn">Import backup<input type="file" id="importBackup" accept=".json,application/json" aria-label="Import backup"></label></div>
        ${state.canUndoImport ? `<button class="btn" id="undoImport">Undo last import</button>` : ""}
        <div class="settings-section-label">Recurring transactions</div>
        <div class="settings-help">Runs when Sprout is open. Removing a rule stops future entries; existing transactions stay.</div>
        ${state.recurringRules.length ? ["personal", "grocery"].map(type => {
          const rules = sortedRecurringRules(type);
          if (!rules.length) return "";
          return `<div class="rule-group-label">${type === "grocery" ? "Grocery" : "Personal"}</div>` + rules.map(rule => `<div class="rule-card"><strong>${escapeHtml(rule.emoji)} ${escapeHtml(rule.name)}</strong><div class="settings-help">${rule.isRefund ? "Payment" : "Expense"} ${fmtCurrency(rule.amount)} · ${escapeHtml(rule.frequency)} · Next ${fmtDate(rule.nextOccurrenceDate)}</div><button class="btn btn-small" data-removerule="${escapeHtml(rule.id)}">Stop repeating</button></div>`).join("");
        }).join("") : `<div class="history-empty">No recurring entries. Add one from the transaction form.</div>`}
        <div class="settings-section-label">Recent months</div>
        <div class="settings-help">Reference your recent closed months without mixing them into your current budget.</div>`;

    if (state.monthHistory.length === 0) {
      h += `<div class="history-empty">Closed months will appear here after you choose Reset Fresh or Carry Over at month rollover.</div>`;
    } else {
      h += `<div class="history-list">`;
      state.monthHistory.forEach(month => {
        const personalRemaining = getArchivedRemaining(month, "personal");
        const groceryRemaining = getArchivedRemaining(month, "grocery");
        h += `<button class="history-row ${state.selectedHistoryMonthKey === month.monthKey ? 'active' : ''}" data-historymonth="${escapeHtml(month.monthKey)}">
          <div class="history-row-top">
            <div>
              <div class="history-month">${fmtMonthKey(month.monthKey)}</div>
              <div class="history-meta">${month.transactions.length} transaction${month.transactions.length === 1 ? "" : "s"} saved</div>
            </div>
            <div class="history-meta">View</div>
          </div>
          <div class="history-pill-row">
            <div class="history-pill ${personalRemaining < 0 ? "negative" : ""}">
              <strong>Personal</strong>
              ${personalRemaining < 0 ? `Over ${fmtCurrency(Math.abs(personalRemaining))}` : `${fmtCurrency(personalRemaining)} left`}
            </div>
            <div class="history-pill ${groceryRemaining < 0 ? "negative" : ""}">
              <strong>Grocery</strong>
              ${groceryRemaining < 0 ? `Over ${fmtCurrency(Math.abs(groceryRemaining))}` : `${fmtCurrency(groceryRemaining)} left`}
            </div>
          </div>
        </button>`;
        if (state.selectedHistoryMonthKey === month.monthKey) {
          h += renderHistoryDetail(month);
        }
      });
      h += `</div>`;
    }

    h += `<div class="settings-section-label">Personal expense categories</div>
        <div class="settings-help">Choose clean labels and icons so quick entry stays easy to scan.</div>
        <div class="cat-list">`;

    state.personalCategories.forEach((cat, i) => {
      h += `<div class="cat-row">
        <button class="cat-emoji-btn" data-catidx="${i}" aria-label="Change icon for ${escapeHtml(cat.label)}">${escapeHtml(cat.emoji)}</button>
        <input class="cat-name-input" data-catnameidx="${i}" aria-label="Category ${i + 1} name" value="${escapeHtml(cat.label)}" placeholder="Category name">
        ${state.personalCategories.length > 1 ? `<button class="cat-remove-btn" data-catremoveidx="${i}" aria-label="Remove ${escapeHtml(cat.label)} category">${icon("x", 16)}</button>` : ''}
      </div>`;
    });

    h += `</div>`;

    if (state.personalCategories.length < 10) {
      h += `<button class="btn cat-add-btn" id="catAddBtn">${icon("plus", 16)} Add category</button>`;
    }

    h += `</div></div>`;
    return h;
  }

  function renderHistoryDetail(month) {
    let h = `<div class="history-detail">
      <div class="history-detail-title">${fmtMonthKey(month.monthKey)} details</div>`;

    [
      { key: "personal", title: "Personal" },
      { key: "grocery", title: "Grocery" },
    ].forEach(section => {
      const remaining = getArchivedRemaining(month, section.key);
      const spent = getArchivedNetSpent(month, section.key);
      const carryover = section.key === "grocery" ? month.groceryCarryover : month.personalCarryover;
      const transactions = getArchivedTx(month, section.key);

      h += `<div class="history-block">
        <div class="settings-section-label">${section.title}</div>
        <div class="history-stats">
          <div class="history-stat">
            <div class="history-stat-label">Budget</div>
            <div class="history-stat-value">${fmtCurrency(getArchivedBudget(month, section.key))}</div>
          </div>
          <div class="history-stat">
            <div class="history-stat-label">Spent</div>
            <div class="history-stat-value">${fmtCurrency(spent)}</div>
          </div>
          <div class="history-stat">
            <div class="history-stat-label">Remaining</div>
            <div class="history-stat-value ${remaining < 0 ? "negative" : ""}">${fmtCurrency(remaining)}</div>
          </div>
          <div class="history-stat">
            <div class="history-stat-label">Carryover</div>
            <div class="history-stat-value">${fmtCurrency(carryover)}</div>
          </div>
        </div>`;

      if (transactions.length === 0) {
        h += `<div class="history-empty">No ${section.title.toLowerCase()} transactions were saved for this month.</div>`;
      } else {
        h += `<div class="history-tx-list">`;
        transactions.forEach(t => {
          h += `<div class="history-tx-row">
            <span class="history-tx-emoji">${t.isRefund ? "💸" : escapeHtml(t.emoji)}</span>
            <div class="history-tx-body">
              <div class="history-tx-top">
                <span class="history-tx-name">${escapeHtml(t.name)}</span>
                <span class="history-tx-amount ${t.isRefund ? "payment" : ""}">${t.isRefund ? "+" : "−"}${fmtCurrency(t.amount)}</span>
              </div>
              <div class="history-tx-meta">${fmtDate(t.date)}${t.isRefund ? " · payment" : ""}${t.note ? " · " + escapeHtml(t.note) : ""}</div>
            </div>
          </div>`;
        });
        h += `</div>`;
      }

      h += `</div>`;
    });

    h += `</div>`;
    return h;
  }

  function renderEmojiPicker() {
    let h = `<div class="emoji-grid-overlay" id="emojiGridOverlay">
      <div class="emoji-grid-modal">
        <div class="emoji-grid-title">Pick an emoji</div>
        <div class="emoji-grid">`;
    EMOJI_OPTIONS.forEach(em => {
      h += `<button data-pickemoji="${em}">${em}</button>`;
    });
    h += `</div>
        <div class="emoji-grid-help">Or type any emoji from your keyboard.</div>
        <div class="emoji-custom">
          <input type="text" id="emojiCustomInput" aria-label="Any emoji" maxlength="16" autocomplete="off">
          <button class="btn btn-primary" id="emojiCustomUse">Use emoji</button>
        </div>
      </div></div>`;
    return h;
  }

  function getLocaleWeekdayLabels() {
    const base = new Date(2024, 0, 7);
    const labels = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(base);
      d.setDate(d.getDate() + i);
      labels.push(d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2));
    }
    const locale = new Intl.Locale(navigator.language || "en-US");
    const firstDay = (locale.getWeekInfo?.() || locale.weekInfo)?.firstDay ?? 7;
    const offset = firstDay === 7 ? 0 : firstDay;
    return { labels: [...labels.slice(offset), ...labels.slice(0, offset)], offset };
  }

  function renderCalendar(cat) {
    const [year, monthNumber] = state.currentMonth.split("-").map(Number);
    const mon = monthNumber - 1;
    const daysInMonth = new Date(year, mon+1, 0).getDate();
    const today = getToday();
    const { labels: weekLabels, offset: weekOffset } = getLocaleWeekdayLabels();
    const rawFirstDow = new Date(year, mon, 1).getDay();
    const firstDow = (rawFirstDow - weekOffset + 7) % 7;

    const txByDay = {};
    getTx(cat).forEach(t => {
      if (!txByDay[t.date]) txByDay[t.date] = [];
      txByDay[t.date].push(t);
    });

    const outside = getTx(cat).filter(t => t.date.slice(0,7) !== state.currentMonth).length;
    let h = `<div class="calendar-card">${outside ? `<div class="settings-help">${outside} transaction${outside === 1 ? " is" : "s are"} dated outside this month. They count toward your totals but are not shown in this calendar.</div>` : ""}<div class="cal-grid">`;
    weekLabels.forEach(d => {
      h += `<div class="cal-day-label">${d}</div>`;
    });
    for (let i = 0; i < firstDow; i++) h += `<div></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${year}-${String(mon+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const items = txByDay[ds] || [];
      const hasItems = items.length > 0;
      const net = sumTransactions(items);
      const isToday = ds === today;
      const isSel = ds === state.selectedCalDay;
      let cls = "cal-day";
      if (hasItems) cls += " has-items";
      if (isToday) cls += " today";
      if (isSel) cls += " selected";
      h += `<button class="${cls}" data-calday="${ds}">
        <span class="cal-num">${d}</span>
        ${hasItems ? `<span class="cal-amount ${net < 0 ? 'refund' : ''}">${net < 0 ? "+" : ""}${fmtCurrency(Math.abs(net))}</span>` : ""}
      </button>`;
    }
    h += `</div>`;

    // Selected day detail
    if (state.selectedCalDay) {
      const items = txByDay[state.selectedCalDay] || [];
      h += `<div class="cal-detail">
        <div class="cal-detail-date">${fmtFullDay(state.selectedCalDay)}</div>`;
      if (items.length === 0) {
        h += `<div class="help">No transactions this day</div>`;
      } else {
        items.forEach(t => {
          h += `<div class="cal-detail-row">
            <span style="color:var(--text1)">${t.isRefund ? "💸" : escapeHtml(t.emoji)} ${escapeHtml(t.name)}${t.isRefund ? '<span style="color:var(--green);font-weight:500"> (payment)</span>' : ""}${t.note ? '<span style="color:var(--text3)"> · '+escapeHtml(t.note)+'</span>' : ""}</span>
            <span class="amt${t.isRefund ? " tag-good" : ""}">${t.isRefund ? "+" : "−"}${fmtCurrency(t.amount)}</span>
          </div>`;
        });
        const netTotal = sumTransactions(items);
        h += `<div class="cal-detail-net">Net: ${fmtCurrency(netTotal)}</div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
    return h;
  }

  // ── Event Binding ──
  function bindEvents() {
    // Sign out
    document.getElementById("signOutBtn")?.addEventListener("click", handleSignOut);

    document.getElementById("importCancel")?.addEventListener("click", () => { state.pendingImport = null; render(); });
    document.getElementById("importConfirm")?.addEventListener("click", confirmImport);
    document.getElementById("exportBackup")?.addEventListener("click", exportCurrentBackup);
    document.getElementById("recoveryExport")?.addEventListener("click", exportCurrentBackup);
    document.getElementById("recoveryOriginal")?.addEventListener("click", () => {
      try {
        const key = cacheKeyForUser(state.user.uid);
        const raw = localStorage.getItem(`${key}:recovery`) || localStorage.getItem(key);
        if (!raw) throw new Error("No original device save is available.");
        const url = URL.createObjectURL(new Blob([raw], {type:"text/plain"}));
        const link = document.createElement("a"); link.href = url; link.download = "Sprout-Recovery.txt"; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) { state.statusMessage = error.message; render(); }
    });
    document.getElementById("importBackup")?.addEventListener("change", e => previewImport(e.target.files[0]));
    document.getElementById("undoImport")?.addEventListener("click", () => { state.pendingAction = {kind:"undo"}; render(); });
    document.querySelectorAll("[data-removerule]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      state.pendingAction = {kind:"stop", id:btn.dataset.removerule}; render();
    }));
    document.getElementById("actionCancel")?.addEventListener("click", () => { state.pendingAction = null; render(); });
    document.getElementById("actionConfirm")?.addEventListener("click", () => {
      const action = state.pendingAction;
      state.pendingAction = null;
      if (action?.kind === "undo") { undoImport(); return; }
      if (action?.kind === "stop" && canEdit()) {
        state.recurringRules = state.recurringRules.filter(r => r.id !== action.id);
        scheduleSave();
      }
      render();
    });
    document.getElementById("resetCancel")?.addEventListener("click", () => { state.showReset = false; render(); });
    // Reset
    document.getElementById("resetBtn")?.addEventListener("click", () => { state.showReset = true; render(); });
    document.getElementById("monthBanner")?.addEventListener("click", () => { state.showReset = true; render(); });
    document.getElementById("resetKeep")?.addEventListener("click", () => {
      if (!canEdit()) return;
      keepLedger(state, getToday());
      state.showReset = false;
      state.selectedCalDay = null;
      state.showForm = null;
      scheduleSave();
      render();
    });
    document.getElementById("resetFresh")?.addEventListener("click", () => resetMonth(false));
    document.getElementById("resetCarry")?.addEventListener("click", () => resetMonth(true));
    document.getElementById("deleteCancel")?.addEventListener("click", () => { state.pendingDeleteId = null; render(); });
    document.getElementById("deleteConfirm")?.addEventListener("click", () => {
      if (state.pendingDeleteId) deleteTransaction(state.pendingDeleteId);
    });

    // Settings
    document.getElementById("settingsBtn")?.addEventListener("click", () => { state.showSettings = true; render(); });
    document.getElementById("settingsClose")?.addEventListener("click", () => {
      state.showSettings = false;
      state.selectedHistoryMonthKey = null;
      render();
    });
    document.getElementById("settingsOverlay")?.addEventListener("click", (e) => {
      if (e.target.id === "settingsOverlay") {
        state.showSettings = false;
        state.selectedHistoryMonthKey = null;
        render();
      }
    });
    document.querySelectorAll("[data-historymonth]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.selectedHistoryMonthKey = state.selectedHistoryMonthKey === btn.dataset.historymonth ? null : btn.dataset.historymonth;
        render();
      });
    });

    // Category emoji change (open emoji picker)
    document.querySelectorAll("[data-catidx]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.emojiPickerForIndex = parseInt(btn.dataset.catidx);
        render();
      });
    });

    // Save category changes immediately, rather than relying on closing Settings.
    // Category name change
    document.querySelectorAll("[data-catnameidx]").forEach(inp => {
      inp.addEventListener("change", () => {
        const idx = parseInt(inp.dataset.catnameidx);
        if (inp.value.trim()) {
          if (!canEdit()) return;
          const label = inp.value.trim();
          state.personalCategories[idx].label = label;
          scheduleSave();
        }
      });
    });

    // Category remove
    document.querySelectorAll("[data-catremoveidx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.dataset.catremoveidx);
        if (!canEdit()) return;
        state.personalCategories.splice(idx, 1);
        scheduleSave(); render();
      });
    });

    // Category add
    document.getElementById("catAddBtn")?.addEventListener("click", () => {
      // Pick a random emoji not already used
      const used = new Set(state.personalCategories.map(c => c.emoji));
      const available = EMOJI_OPTIONS.filter(e => !used.has(e));
      const emoji = available.length > 0 ? available[0] : "📌";
      if (!canEdit()) return;
      let label = "New";
      for (let n = 2; state.personalCategories.some(c => c.label === label); n++) label = `New ${n}`;
      state.personalCategories.push({ id:newTransactionId(), emoji, label });
      scheduleSave(); render();
    });

    // Emoji grid picker
    document.querySelectorAll("[data-pickemoji]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (state.emojiPickerForIndex !== null) setCategoryEmoji(state.emojiPickerForIndex, btn.dataset.pickemoji);
      });
    });
    const useCustomEmoji = () => {
      if (state.emojiPickerForIndex !== null) setCategoryEmoji(state.emojiPickerForIndex, document.getElementById("emojiCustomInput")?.value);
    };
    document.getElementById("emojiCustomUse")?.addEventListener("click", useCustomEmoji);
    document.getElementById("emojiCustomInput")?.addEventListener("keydown", e => { if (e.key === "Enter") useCustomEmoji(); });
    document.getElementById("emojiGridOverlay")?.addEventListener("click", (e) => {
      if (e.target.id === "emojiGridOverlay") { state.emojiPickerForIndex = null; render(); }
    });

    // ── Holiday ──
    document.getElementById("holidayBudgetEdit")?.addEventListener("click", () => {
      state.editingBudget = true;
      state.budgetInput = editableAmount(fromCents(season().budget));
      state.budgetError = ""; render();
    });
    document.getElementById("holidayBudgetCancel")?.addEventListener("click", () => { state.editingBudget = false; render(); });
    document.getElementById("holidayBudgetInput")?.addEventListener("input", e => { state.budgetInput = e.target.value; });
    document.getElementById("holidayBudgetInput")?.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("holidayBudgetSave")?.click();
    });
    document.getElementById("holidayBudgetSave")?.addEventListener("click", () => {
      if (!canEdit()) return;
      const cents = parseHolidayCents(document.getElementById("holidayBudgetInput").value);
      if (cents === null || cents < 0) { state.budgetError = "Enter a valid amount from $0 to $999,999.99."; render(); return; }
      state.budgetError = "";
      state.editingBudget = false;
      commitSeason({ ...season(), budget: cents });
      render();
    });

    document.getElementById("holidayAddGift")?.addEventListener("click", () => {
      startHolidayGiftForm({ recipientID: state.holidayDetailId });
    });
    document.getElementById("holidayAddReturn")?.addEventListener("click", () => {
      startHolidayGiftForm({ recipientID: state.holidayDetailId, isReturn: true });
    });
    document.getElementById("holidayAddPerson")?.addEventListener("click", () => startHolidayPersonForm());
    document.getElementById("holidayNewSeason")?.addEventListener("click", () => {
      state.holidayFormError = "";
      state.holidayForm = { kind: "season", label: "", carry: season().recipients.length > 0 };
      render();
    });
    document.getElementById("holidayRenameSeason")?.addEventListener("click", () => {
      state.holidayFormError = "";
      state.holidayForm = { kind: "rename", label: season().label };
      render();
    });
    document.getElementById("holidayRenameName")?.addEventListener("input", e => { state.holidayForm.label = e.target.value; });
    document.getElementById("holidayRenameSave")?.addEventListener("click", saveHolidayRename);
    document.getElementById("holidayPastSeasons")?.addEventListener("click", () => { state.showHolidaySeasons = true; render(); });
    document.getElementById("holidaySeasonsClose")?.addEventListener("click", () => { state.showHolidaySeasons = false; render(); });
    document.getElementById("holidayFormCancel")?.addEventListener("click", () => {
      state.holidayForm = null; state.holidayFormError = ""; render();
    });
    document.getElementById("holidayBack")?.addEventListener("click", () => {
      state.holidayDetailId = undefined; state.holidayForm = null; state.holidayFormError = ""; render();
    });

    document.getElementById("holidayGiftName")?.addEventListener("input", e => { state.holidayForm.name = e.target.value; });
    document.getElementById("holidayGiftAmount")?.addEventListener("input", e => { state.holidayForm.amount = e.target.value; });
    document.getElementById("holidayGiftNote")?.addEventListener("input", e => { state.holidayForm.note = e.target.value; });
    document.getElementById("holidayGiftDate")?.addEventListener("input", e => { state.holidayForm.date = e.target.value; });
    document.getElementById("holidayGiftSave")?.addEventListener("click", saveHolidayGift);
    document.querySelectorAll("[data-holidaypick]").forEach(btn => btn.addEventListener("click", () => {
      state.holidayForm.recipientID = btn.dataset.holidaypick || null;
      state.holidayForm.recipientChosen = true;
      render();
    }));

    document.getElementById("holidayPersonName")?.addEventListener("input", e => { state.holidayForm.name = e.target.value; });
    document.getElementById("holidayPersonPlanned")?.addEventListener("input", e => { state.holidayForm.planned = e.target.value; });
    document.getElementById("holidayPersonSave")?.addEventListener("click", saveHolidayPerson);
    document.querySelectorAll("[data-holidayemoji]").forEach(btn => btn.addEventListener("click", () => {
      state.holidayForm.emoji = btn.dataset.holidayemoji; render();
    }));

    document.getElementById("holidaySeasonName")?.addEventListener("input", e => { state.holidayForm.label = e.target.value; });
    document.getElementById("holidayCarry")?.addEventListener("change", e => { state.holidayForm.carry = e.target.checked; });
    document.getElementById("holidaySeasonSave")?.addEventListener("click", saveHolidayNewSeason);

    document.getElementById("holidaySearch")?.addEventListener("input", e => {
      state.holidaySearch = e.target.value; render();
    });
    document.getElementById("txSearch")?.addEventListener("input", e => {
      state.txSearch = e.target.value; render();
    });

    document.querySelectorAll("[data-holidayopen]").forEach(btn => btn.addEventListener("click", () => {
      state.holidayDetailId = btn.dataset.holidayopen || null;
      state.holidayForm = null; state.holidayFormError = ""; render();
    }));
    document.querySelectorAll("[data-holidayeditperson]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      startHolidayPersonForm(btn.dataset.holidayeditperson);
    }));
    document.querySelectorAll("[data-holidayeditgift]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      startHolidayGiftForm({ id: btn.dataset.holidayeditgift });
    }));
    document.querySelectorAll("[data-holidayremoveperson]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      state.pendingHolidayDelete = { kind: "person", id: btn.dataset.holidayremoveperson }; render();
    }));
    document.querySelectorAll("[data-holidayremovegift]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      state.pendingHolidayDelete = { kind: "gift", id: btn.dataset.holidayremovegift }; render();
    }));
    document.querySelectorAll("[data-holidayremoveseason]").forEach(btn => btn.addEventListener("click", () => {
      if (!canEdit()) return;
      state.pendingHolidayDelete = { kind: "season", id: btn.dataset.holidayremoveseason }; render();
    }));
    document.getElementById("holidayDeleteCancel")?.addEventListener("click", () => { state.pendingHolidayDelete = null; render(); });
    document.getElementById("holidayDeleteConfirm")?.addEventListener("click", confirmHolidayDelete);

    // Tabs
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.addEventListener("click", () => switchSection(btn.dataset.tab));
    });

    // Budget setter
    document.getElementById("budgetEdit")?.addEventListener("click", () => { state.editingBudget = true; state.budgetInput = editableAmount(getBaseBudget(budgetCat())); state.budgetError = ""; render(); });
    document.getElementById("budgetSave")?.addEventListener("click", () => {
      if (!canEdit()) return;
      const v = parseAmount(document.getElementById("budgetInput").value, navigator.language || "en-US");
      if (v === null) { state.budgetError = "Enter a valid amount from $0 to $999,999.99."; render(); return; }
      state.budgetError = "";
      if (v >= 0) {
        // Sets the recurring monthly budget; carryover is separate and untouched.
        // This used to take base + carryover and back a new base out of it, so a
        // one-month adjustment permanently moved the monthly budget, and anything
        // below the carryover set the base to zero forever while deleting the
        // difference. Matches Sprout-iOS `BudgetStore.setBudget`.
        if (budgetCat() === "grocery") {
          state.groceryBudget = v;
        } else {
          state.personalBudget = v;
        }
        state.editingBudget = false;
        scheduleSave(); render();
      }
    });
    document.getElementById("budgetCancel")?.addEventListener("click", () => { state.editingBudget = false; render(); });
    document.getElementById("budgetInput")?.addEventListener("input", e => { state.budgetInput = e.target.value; });
    document.getElementById("budgetInput")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("budgetSave")?.click();
    });

    // Calendar
    document.getElementById("calToggle")?.addEventListener("click", () => {
      state.showCalendar = !state.showCalendar; state.selectedCalDay = null; render();
    });
    document.querySelectorAll("[data-calday]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.selectedCalDay = state.selectedCalDay === btn.dataset.calday ? null : btn.dataset.calday;
        render();
      });
    });

    // Quick add
    document.querySelectorAll("[data-quickname]").forEach(btn => {
      btn.addEventListener("click", () => {
        startForm("expense", {name:btn.dataset.quickname, emoji:btn.dataset.quickemoji});
        document.getElementById("formAmount")?.focus();
      });
    });

    // Add buttons
    document.getElementById("addExpense")?.addEventListener("click", () => startForm("expense"));
    document.getElementById("addPayment")?.addEventListener("click", () => startForm("payment"));

    // Emoji picker
    document.querySelectorAll("[data-emoji]").forEach(btn => {
      btn.addEventListener("click", () => { state.formEmoji = btn.dataset.emoji; render(); });
    });

    // Form inputs (sync to state)
    document.getElementById("formName")?.addEventListener("input", (e) => { state.formName = e.target.value; state.formError = ""; });
    document.getElementById("formAmount")?.addEventListener("input", (e) => { state.formAmount = e.target.value; state.formError = ""; });
    document.getElementById("formNote")?.addEventListener("input", (e) => { state.formNote = e.target.value; });
    document.getElementById("formDate")?.addEventListener("change", (e) => {
      state.formDate = e.target.value;
      state.formNextDate = nextOccurrence(state.formDate, state.formFrequency, Number(state.formDate.slice(-2)));
      render();
    });
    document.getElementById("formRecurring")?.addEventListener("change", e => { state.formRecurring = e.target.checked; render(); });
    document.getElementById("formFrequency")?.addEventListener("change", e => {
      state.formFrequency = e.target.value;
      state.formNextDate = nextOccurrence(state.formDate, state.formFrequency, Number(state.formDate.slice(-2))); render();
    });
    document.getElementById("formNextDate")?.addEventListener("input", e => { state.formNextDate = e.target.value; });
    document.getElementById("formMode")?.addEventListener("change", e => setFormMode(e.target.value));
    document.querySelectorAll("[data-editid]").forEach(btn => btn.addEventListener("click", () => {
      const entry = state.transactions.find(t => t.id === btn.dataset.editid);
      if (entry) startForm(entry.isRefund ? "payment" : "expense", entry, true);
    }));

    // Form submit / cancel
    document.getElementById("formSubmit")?.addEventListener("click", () => {
      addTransaction(state.showForm === "payment");
    });
    document.getElementById("formCancel")?.addEventListener("click", () => {
      state.showForm = null; state.formName = ""; state.formAmount = ""; state.formNote = "";
      state.formDate = getToday(); render();
    });

    // Data recovery is read-only until a validated import resolves it.
    if (!canEdit()) document.querySelectorAll("#budgetEdit,#addExpense,#addPayment,#resetBtn,#catAddBtn,[data-catnameidx],[data-catidx],[data-catremoveidx],[data-editid],[data-txid],[data-removerule],[data-quickname]").forEach(el => { el.disabled = true; });
    // Delete transaction
    document.querySelectorAll("[data-txid]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.pendingDeleteId = btn.dataset.txid;
        render();
      });
    });
  }

  // The "…" menus are native <details>. They close themselves when one of
  // their items re-renders the page; this closes them for a tap anywhere else.
  function closeMenus(except) {
    document.querySelectorAll("details.menu[open]").forEach(menu => { if (menu !== except) menu.open = false; });
  }
  document.addEventListener("click", event => {
    closeMenus(event.target?.closest?.("details.menu") || null);
  });
  document.addEventListener("keydown", event => {
    if (event.key !== "Escape") return;
    closeMenus(null);
    const cancel = document.getElementById("actionCancel") || document.getElementById("importCancel") || document.getElementById("resetCancel") || document.getElementById("deleteCancel") || document.getElementById("settingsClose");
    if (state.emojiPickerForIndex !== null) { state.emojiPickerForIndex = null; render(); }
    else cancel?.click();
  });
  window.addEventListener("focus", refreshDate);
  document.addEventListener("visibilitychange", refreshDate);
  // Initial render
  render();
</script>
