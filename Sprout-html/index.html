<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprout">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
  <!-- PWA Manifest -->
  <link rel="manifest" href="sprout.webmanifest">
  <meta name="theme-color" content="#8fae8b">
  <meta name="msapplication-TileColor" content="#8fae8b">
<title>Sprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdfbf8;
    --card: #ffffff;
    --text1: #3d3630;
    --text2: #8a7f74;
    --text3: #a09788;
    --text4: #c4b8ab;
    --sage: #8fae8b;
    --sage-dark: #7a9d76;
    --sage-light: #eef4ed;
    --green: #6a9e66;
    --green-dark: #5a8c56;
    --green-bg: #f0f6ef;
    --green-border: #c5dcc3;
    --amber: #d4a96a;
    --red: #c97a7a;
    --border: #ece7e0;
    --input-border: #e0d9d0;
    --chip: #f5f0ea;
    --chip-hover: #ece7e0;
    --divider: #f0ebe4;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); font-family: var(--font-body); color: var(--text1); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  button { font-family: var(--font-body); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4cdc4; border-radius: 99px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* ── App Shell ── */
  #app {
    max-width: 440px; margin: 0 auto; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
  }
  .header { padding: 24px 20px 0; animation: fadeIn 0.4s ease; flex-shrink: 0; }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header h1 { font-family: var(--font-display); font-size: 26px; font-weight: 500; color: var(--text1); letter-spacing: -0.5px; }
  .header-date { font-size: 13px; color: var(--text3); margin-bottom: 4px; }
  .btn-reset {
    background: var(--chip); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--text2);
    transition: all 0.15s ease; display: flex; align-items: center; gap: 4px;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); }

  .content { flex: 1; padding: 12px 20px 0; overflow-y: auto; padding-bottom: 80px; }
  .content > div { animation: slideUp 0.3s ease; }

  /* ── Tab Bar ── */
  .tab-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(253,251,248,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border); display: flex; padding: 8px 16px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .tab-btn {
    flex: 1; background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; transition: all 0.15s ease;
  }
  .tab-btn .tab-icon { font-size: 20px; }
  .tab-btn .tab-label { font-size: 11px; color: var(--text3); font-weight: 400; }
  .tab-btn.active { opacity: 1; }
  .tab-btn.active .tab-label { color: var(--sage); font-weight: 600; }
  .tab-btn:not(.active) { opacity: 0.5; }

  /* ── Summary Card ── */
  .summary-card {
    background: var(--card); border-radius: 18px; padding: 18px;
    margin-bottom: 14px; border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
  }
  .summary-top { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px; }
  .budget-setter { display: flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--text2); }
  .budget-setter .edit-icon { font-size: 10px; color: var(--text4); }
  .budget-edit { display: flex; align-items: center; gap: 6px; }
  .budget-edit-input {
    width: 100px; padding: 5px 8px; border: 2px solid var(--sage); border-radius: 8px;
    font-size: 16px; font-family: var(--font-mono); color: var(--text1); outline: none; background: #fff;
  }
  .budget-edit-save {
    background: var(--sage); border: none; border-radius: 6px; padding: 5px 12px;
    color: #fff; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .budget-edit-cancel { background: none; border: none; color: var(--text3); font-size: 14px; cursor: pointer; }
  .carryover-note { margin-top: -2px; margin-bottom: 10px; text-align: right; font-size: 11px; color: var(--text3); }

  /* ── Progress Bar ── */
  .bar-labels { display: flex; justify-content: space-between; font-size: 13px; color: #7a7067; margin-bottom: 4px; }
  .bar-remaining { font-weight: 600; }
  .bar-remaining.positive { color: #5a6e58; }
  .bar-remaining.negative { color: var(--red); }
  .bar-track { position: relative; height: 10px; border-radius: 99px; background: #e8e2da; overflow: hidden; }
  .bar-pace {
    position: absolute; inset: 0 auto 0 0; height: 100%;
    border-radius: 99px; background: #d3cdc5; transition: width 0.5s ease;
  }
  .bar-fill {
    position: absolute; inset: 0 auto 0 0; height: 100%;
    border-radius: 99px; transition: width 0.5s ease, background 0.4s ease;
  }

  .remaining-display { text-align: center; padding: 10px 0 4px; border-top: 1px solid var(--divider); margin-top: 10px; }
  .remaining-amount { font-family: var(--font-mono); font-size: 28px; font-weight: 600; }
  .remaining-amount.negative { color: var(--red); }
  .remaining-label { font-size: 12px; color: var(--text3); margin-top: 2px; }

  /* ── Daily Allowance ── */
  .daily-allowance {
    text-align: center; padding: 8px 0 2px;
    animation: fadeIn 0.3s ease;
  }
  .daily-amount {
    font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--sage-dark);
  }
  .daily-amount.negative { color: var(--red); }
  .daily-label { font-size: 11px; color: var(--text4); margin-top: 1px; }

  /* ── Calendar Toggle ── */
  .calendar-toggle {
    width: 100%; margin-bottom: 14px; padding: 9px 14px;
    border-radius: 12px; cursor: pointer; font-size: 13px;
    transition: all 0.15s ease; display: flex; align-items: center;
    justify-content: center; gap: 6px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text2);
  }
  .calendar-toggle.active { background: var(--sage-light); border-color: var(--sage); color: #5a6e58; }

  /* ── Calendar ── */
  .calendar-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 14px;
    border: 1px solid var(--border); animation: fadeIn 0.2s ease;
  }
  .cal-month { text-align: center; font-family: var(--font-display); font-size: 18px; color: var(--text1); margin-bottom: 14px; font-weight: 500; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-day-label { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-day {
    aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px;
    background: transparent; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 2px; transition: all 0.15s ease;
    font-family: var(--font-body);
  }
  .cal-day:hover { background: var(--chip); }
  .cal-day.has-items { background: var(--chip); }
  .cal-day.today { border: 2px solid var(--amber); }
  .cal-day.today .cal-num { color: var(--amber); font-weight: 700; }
  .cal-day.selected { border: 2px solid var(--sage); background: var(--sage-light); }
  .cal-num { font-size: 13px; color: var(--text1); }
  .cal-amount { font-size: 9px; font-family: var(--font-mono); font-weight: 600; margin-top: 1px; color: var(--text2); }
  .cal-amount.refund { color: var(--green); }
  .cal-detail {
    margin-top: 14px; background: var(--chip); border-radius: 14px;
    padding: 14px; border: 1px solid var(--border); animation: fadeIn 0.2s ease;
  }
  .cal-detail-date { font-size: 13px; color: var(--text2); margin-bottom: 8px; font-weight: 500; }
  .cal-detail-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .cal-detail-net { display: flex; justify-content: flex-end; margin-top: 8px; font-size: 14px; font-weight: 600; color: #5a6e58; font-family: var(--font-mono); }

  /* ── Quick Add ── */
  .quick-add-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; }
  .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .quick-chip {
    background: var(--chip); border: 1px solid var(--border); border-radius: 99px;
    padding: 5px 12px; cursor: pointer; font-size: 13px; color: #5a5048;
    transition: all 0.15s ease; display: flex; align-items: center; gap: 4px;
  }
  .quick-chip:hover { background: var(--chip-hover); }

  /* ── Add Buttons ── */
  .add-buttons { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-add {
    flex: 1; padding: 12px; border: 2px dashed #d4cdc4; border-radius: 14px;
    background: transparent; cursor: pointer; font-size: 14px; color: var(--text2);
    transition: all 0.2s ease;
  }
  .btn-add:hover { border-color: var(--sage); color: #5a6e58; }
  .btn-add.payment:hover { border-color: var(--green); color: var(--green); }

  /* ── Add Form ── */
  .add-form {
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
    border: 1px solid var(--border); background: var(--chip);
  }
  .add-form.payment { background: var(--green-bg); border-color: var(--green-border); }
  .form-header { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: var(--text2); }
  .add-form.payment .form-header { color: var(--green); }
  .emoji-picker { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
  .emoji-btn {
    background: var(--chip-hover); color: #5a5048; border: none; border-radius: 99px;
    padding: 5px 10px; cursor: pointer; font-size: 13px; transition: all 0.15s ease;
    display: flex; align-items: center; gap: 3px;
  }
  .emoji-btn.selected { background: var(--sage); color: #fff; }
  .emoji-btn span:last-child { font-size: 11px; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--input-border);
    border-radius: 10px; font-size: 14px; font-family: var(--font-body);
    background: #fff; color: var(--text1); outline: none;
  }
  .form-input:focus { border-color: var(--sage); }
  .add-form.payment .form-input:focus { border-color: var(--green); }
  .form-input.mono { font-family: var(--font-mono); width: 90px; flex: none; }
  .form-input.small { font-size: 13px; }
  .form-input.date { width: 130px; flex: none; font-size: 13px; }
  .form-actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn-submit {
    flex: 1; padding: 10px; border: none; border-radius: 10px;
    background: var(--sage); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s ease;
  }
  .btn-submit:hover { background: var(--sage-dark); }
  .add-form.payment .btn-submit { background: var(--green); }
  .add-form.payment .btn-submit:hover { background: var(--green-dark); }
  .btn-cancel {
    padding: 10px 16px; border: 1px solid var(--input-border); border-radius: 10px;
    background: #fff; color: var(--text2); font-size: 14px; cursor: pointer;
  }

  /* ── Transaction List ── */
  .tx-header { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px; margin-top: 2px; }
  .tx-empty { text-align: center; padding: 28px 0; color: var(--text4); font-size: 14px; font-style: italic; }
  .tx-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tx-emoji { font-size: 22px; line-height: 1.2; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-top { display: flex; justify-content: space-between; align-items: center; }
  .tx-name { font-weight: 500; color: var(--text1); font-size: 14px; }
  .tx-amount { font-family: var(--font-mono); font-weight: 500; font-size: 14px; white-space: nowrap; margin-left: 8px; color: #5a6e58; }
  .tx-amount.payment { color: var(--green); }
  .tx-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .tx-meta { font-size: 12px; color: var(--text3); }
  .tx-meta .payment-tag { color: var(--green); font-weight: 500; }
  .tx-remove { background: none; border: none; cursor: pointer; color: var(--text4); font-size: 12px; padding: 2px 4px; }
  .tx-remove:hover { color: var(--red); }

  /* ── Login Screen ── */
  .login-screen {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: var(--bg); padding: 40px;
  }
  .login-sprout { font-size: 56px; margin-bottom: 16px; }
  .login-title { font-family: var(--font-display); font-size: 32px; font-weight: 500; color: var(--text1); margin-bottom: 6px; }
  .login-sub { font-size: 15px; color: var(--text3); margin-bottom: 32px; }
  .btn-google {
    display: flex; align-items: center; gap: 10px; padding: 12px 28px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    cursor: pointer; font-size: 15px; font-weight: 500; color: var(--text1);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: all 0.2s ease;
  }
  .btn-google:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); transform: translateY(-1px); }
  .btn-google svg { width: 20px; height: 20px; }
  .login-loading { font-size: 16px; color: var(--text3); }

  /* ── User Bar ── */
  .user-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0 2px; margin-bottom: 0;
  }
  .user-info { display: flex; align-items: center; gap: 8px; }
  .user-avatar { width: 24px; height: 24px; border-radius: 99px; object-fit: cover; }
  .user-name { font-size: 12px; color: var(--text3); }
  .btn-signout { background: none; border: none; font-size: 11px; color: var(--text4); cursor: pointer; }
  .btn-signout:hover { color: var(--red); }

  /* ── Reset Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(61,54,48,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--bg); border-radius: 20px; padding: 28px; max-width: 340px; width: calc(100% - 40px);
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .modal-icon { font-size: 36px; margin-bottom: 12px; }
  .modal-title { font-family: var(--font-display); font-size: 18px; color: var(--text1); margin-bottom: 8px; }
  .modal-text { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-btn {
    flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .modal-btn.keep { background: #fff; border: 1px solid var(--input-border); color: var(--text2); }
  .modal-btn.reset { background: var(--sage); border: none; color: #fff; font-weight: 600; }

  /* ── Settings Modal ── */
  .settings-modal {
    background: var(--bg); border-radius: 20px; padding: 24px; max-width: 360px; width: calc(100% - 40px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: left; max-height: 80vh; overflow-y: auto;
  }
  .settings-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
  }
  .settings-title { font-family: var(--font-display); font-size: 20px; color: var(--text1); font-weight: 500; }
  .settings-close { background: none; border: none; font-size: 22px; color: var(--text3); cursor: pointer; padding: 4px; }
  .settings-section-label {
    font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 8px; margin-top: 16px;
  }
  .settings-section-label:first-of-type { margin-top: 0; }
  .cat-list { display: flex; flex-direction: column; gap: 6px; }
  .cat-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  }
  .cat-emoji-btn {
    font-size: 20px; background: none; border: none; cursor: pointer;
    padding: 2px 4px; border-radius: 8px; transition: background 0.15s;
  }
  .cat-emoji-btn:hover { background: var(--chip-hover); }
  .cat-name-input {
    flex: 1; border: none; background: transparent; font-size: 14px;
    font-family: var(--font-body); color: var(--text1); outline: none;
    padding: 2px 0;
  }
  .cat-name-input:focus { border-bottom: 1px solid var(--sage); }
  .cat-remove-btn {
    background: none; border: none; cursor: pointer; color: var(--text4);
    font-size: 16px; padding: 2px 6px; border-radius: 6px; transition: all 0.15s;
  }
  .cat-remove-btn:hover { color: var(--red); background: rgba(201,122,122,0.1); }
  .cat-add-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px; border: 2px dashed var(--border); border-radius: 12px;
    background: transparent; cursor: pointer; font-size: 13px; color: var(--text3);
    margin-top: 6px; transition: all 0.15s;
  }
  .cat-add-btn:hover { border-color: var(--sage); color: var(--sage); }
  .settings-help {
    font-size: 12px; color: var(--text3); line-height: 1.45; margin-bottom: 10px;
  }
  .history-empty {
    font-size: 13px; color: var(--text3); line-height: 1.5;
    padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  }
  .history-list { display: flex; flex-direction: column; gap: 10px; }
  .history-row {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; cursor: pointer; transition: all 0.15s ease;
  }
  .history-row:hover { border-color: var(--sage); }
  .history-row.active { border-color: var(--sage); background: var(--sage-light); }
  .history-row-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px;
  }
  .history-month { font-family: var(--font-display); font-size: 18px; color: var(--text1); font-weight: 500; }
  .history-meta { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .history-pill-row { display: flex; gap: 8px; }
  .history-pill {
    flex: 1; background: var(--chip); border-radius: 12px; padding: 10px 12px;
    font-size: 12px; color: var(--text2); line-height: 1.35;
  }
  .history-pill strong { display: block; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
  .history-pill.negative { color: var(--red); }
  .history-detail {
    margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--bg);
    border: 1px solid var(--border);
  }
  .history-detail-title {
    font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.1px; margin-bottom: 10px;
  }
  .history-stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .history-stat {
    flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  .history-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 4px; }
  .history-stat-value { font-size: 13px; color: var(--text1); font-weight: 600; font-family: var(--font-mono); }
  .history-stat-value.negative { color: var(--red); }
  .history-tx-list { display: flex; flex-direction: column; gap: 8px; }
  .history-tx-row {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start;
  }
  .history-tx-emoji { font-size: 20px; line-height: 1.2; }
  .history-tx-body { flex: 1; min-width: 0; }
  .history-tx-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .history-tx-name { font-size: 13px; color: var(--text1); font-weight: 500; }
  .history-tx-amount { font-size: 13px; font-family: var(--font-mono); font-weight: 600; color: #5a6e58; white-space: nowrap; }
  .history-tx-amount.payment { color: var(--green); }
  .history-tx-meta { font-size: 11px; color: var(--text3); margin-top: 3px; line-height: 1.4; }

  /* ── Emoji Picker Grid (for changing category emoji) ── */
  .emoji-grid-overlay {
    position: fixed; inset: 0; background: rgba(61,54,48,0.3);
    display: flex; align-items: center; justify-content: center;

  }
  .emoji-grid button:hover { background: var(--chip-hover); }

  /* ── Settings gear button ── */
  .btn-settings {
    background: var(--chip); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 10px; cursor: pointer; font-size: 15px; color: var(--text2);
    transition: all 0.15s ease; margin-left: 6px;
  }
  .btn-settings:hover { border-color: var(--sage); color: var(--sage); }
  .notice { margin: 12px 0; padding: 12px; border-radius: 12px; background: #fff4dc; color: #62451f; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .notice button { margin: 4px; }
  .modal-actions, .form-actions { flex-wrap: wrap; }
  .modal { max-height: 85dvh; overflow-y: auto; }
  .cal-amount { font-size: clamp(8px, 2.2vw, 11px); overflow-wrap: anywhere; }
  .form-row label { min-width: 0; flex: 1; font-size: 13px; }

  button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
</style>

<body>

<div id="app"></div>

<script src="./sprout-firebase-config.js"></script>
<script src="./sprout-firebase-config.local.js"></script>
<script type="module">
  import { toCents, fromCents, parseAmount, netSpent as sumTransactions, sumMoney, paceStatus, progress } from "./money.mjs";
  import { validDate, monthInfo, nextOccurrence, processRecurring, resetLedger, keepLedger } from "./ledger.mjs";
  import { normalizeSnapshot, exportBackup, containsHolidayData } from "./backup.mjs";
  import * as Holiday from "./holiday.mjs";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ── Firebase Config ──
  const firebaseConfig = window.SPROUT_FIREBASE;

  if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("REPLACE_WITH_")) {
    document.getElementById("app").innerHTML = `
      <main style="max-width: 720px; margin: 48px auto; padding: 24px; font-family: Georgia, serif; color: #3f3a34;">
        <h1 style="margin-bottom: 12px;">Sprout needs a local Firebase config</h1>
        <p style="font: 16px/1.5 system-ui, sans-serif; color: #6f675f;">
          Copy <code>sprout-firebase-config.example.js</code> to <code>sprout-firebase-config.local.js</code>
          and fill in your Firebase web app settings before loading the web prototype.
        </p>
      </main>
    `;
    throw new Error("Missing local Firebase config. Expected Sprout-html/sprout-firebase-config.local.js.");
  }

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  // ── Default Categories ──
  const DEFAULT_PERSONAL_CATEGORIES = [
    { emoji: "🛍️", label: "Shopping" },
    { emoji: "🎁", label: "Gifts" },
    { emoji: "💄", label: "Beauty" },
    { emoji: "🍕", label: "Dining" },
    { emoji: "🚗", label: "Gas" },
  ];

  const EMOJI_OPTIONS = [
    "🛍️","🎁","💄","🍕","🚗","☕","🍔","🎬","🎮","💊",
    "🏥","✂️","🐕","🐈","🏠","🔧","📱","💻","📚","🎵",
    "✈️","🏋️","🧹","👕","👟","🎨","🌮","🍺","🍷","🧃",
    "🛒","💡","📦","🎲","🪴","🧴","💇","🎂","🎉","⛽",
    "🚌","🚕","🅿️","💰","🏦","📝","🔑","🧊","🍿","🎧",
  ];

  // ── State ──
  let state = {
    user: null,
    dataReady: false,
    writeBlocked: false,
    statusMessage: "",
    updatedAt: null,
    editingTransactionId: null,
    formError: "",
    budgetError: "",
    budgetInput: "",
    formRecurring: false,
    formFrequency: "monthly",
    formNextDate: "",
    pendingImport: null,
    pendingAction: null,
    canUndoImport: false,
    authLoading: true,
    authError: "",
    // "personal" | "grocery" | "holiday". Holiday is not a monthly budget, so
    // every monthly figure reads `budgetCat()` instead, which only ever answers
    // one of the two budget tabs. One stored selection, as on iOS.
    activeSection: "personal",
    groceryBudget: 400,
    personalBudget: 200,
    transactions: [],
    monthHistory: [],
    personalCategories: [...DEFAULT_PERSONAL_CATEGORIES],
    currentMonth: getCurrentMonth(),
    recurringRules: [],
    showCalendar: false,
    showForm: null, // null | "expense" | "payment"
    showReset: false,
    pendingDeleteId: null,
    showSettings: false,
    editingBudget: false,
    selectedCalDay: null,
    selectedHistoryMonthKey: null,
    formName: "",
    formAmount: "",
    formNote: "",
    formEmoji: "🛍️",
    formDate: getToday(),
    personalCarryover: 0,
    groceryCarryover: 0,
    // Emoji picker state for settings
    emojiPickerForIndex: null, // index of category being edited
    // ── Holiday ──
    // Amounts inside these two are integer CENTS, not dollars. See the header
    // of holiday.mjs for why; every read goes through a `...Cents` helper.
    holidaySeason: Holiday.emptySeason(),
    holidaySeasonHistory: [],
    holidayForm: null,        // null | {kind:"gift"|"person"|"season", ...}
    holidayFormError: "",
    holidaySearch: "",
    txSearch: "",
    holidayDetailId: undefined, // undefined = list; null = unassigned; id = person
    showHolidaySeasons: false,
    pendingHolidayDelete: null, // {kind:"gift"|"person"|"season", id}
  };

  // ── Helpers ──
  function escapeHtml(str) {
    if (typeof str !== "string") return "";
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function getCurrentMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
  function getToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function editableAmount(n) {
    return new Intl.NumberFormat(navigator.language || "en-US", {useGrouping:false, maximumFractionDigits:2}).format(n);
  }
  function fmtCurrency(n) {
    return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
  }
  function fmtDate(s) {
    const d = new Date(s+"T12:00:00");
    return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  }
  function fmtFullDay(s) {
    const d = new Date(s+"T12:00:00");
    return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  }
  function fmtMonthYear() { return fmtMonthKey(state.currentMonth); }
  function fmtMonthKey(monthKey) {
    return new Date(`${monthKey}-01T12:00:00`).toLocaleDateString("en-US", {month:"long",year:"numeric"});
  }
  function displayedMonth() { return monthInfo(state.currentMonth, getToday()); }
  function getDaysLeftInMonth() { return displayedMonth().daysLeft; }
  function getMonthPaceProgress() { return displayedMonth().pace; }
  /**
   * Coloured by how much of the budget is gone, matching `spendingColor` in
   * Sprout-iOS `SummaryCardView`. It used to be coloured by *pace*, which made
   * a month spent 1.01x over budget on its final day amber here and red on
   * iOS — the bar disagreed with the headline beside it. Pace is its own
   * signal now, shown as a dot and a label.
   */
  function getProgressColor(spent, budget) {
    const remaining = sumMoney(budget, -spent);
    const filled = progress(spent, budget);
    if (remaining < 0 || filled >= 1) return "var(--red)";
    if (filled >= 0.8) return "var(--amber)";
    return "var(--sage)";
  }

  function getPaceLabel(spent, budget) {
    const {day, days} = displayedMonth();
    return {
      ahead: {text: "Spending too fast", color: "var(--red)"},
      on: {text: "Spending on plan", color: "var(--amber)"},
      behind: {text: "Spending under plan", color: "var(--sage)"},
    }[paceStatus(spent, budget, day, days)];
  }


  function compareTxByDateOnly(a, b) {
    if (a.date < b.date) return -1;
    if (a.date > b.date) return 1;
    return 0;
  }
  function compareMonthKeyDesc(a, b) {
    if (a.monthKey > b.monthKey) return -1;
    if (a.monthKey < b.monthKey) return 1;
    return 0;
  }
  function getCarryover(cat) { return cat === "grocery" ? state.groceryCarryover : state.personalCarryover; }
  function getCarryoverPreview() {
    return {
      personal: Math.max(0, getRemaining("personal")),
      grocery: Math.max(0, getRemaining("grocery"))
    };
  }

  function getArchivedMonth(monthKey) {
    return state.monthHistory.find(month => month.monthKey === monthKey) || null;
  }
  function getArchivedTx(month, cat) {
    return (month?.transactions || [])
      .filter(t => t.type === cat)
      .sort(compareTxByDateOnly)
      .reverse();
  }
  function getArchivedBudget(month, cat) {
    const base = cat === "grocery" ? month.groceryBudget : month.personalBudget;
    const carry = cat === "grocery" ? month.groceryCarryover : month.personalCarryover;
    return sumMoney(base, carry);
  }
  function getArchivedNetSpent(month, cat) {
    return sumTransactions(getArchivedTx(month, cat));
  }
  function getArchivedRemaining(month, cat) {
    return sumMoney(getArchivedBudget(month, cat), -getArchivedNetSpent(month, cat));
  }


  const LOCAL_CACHE_KEY = "sprout-cache-v1";
  let saveTimer = null;
  let cloudWriteQueue = Promise.resolve();
  let authGeneration = 0;
  function queueCloudWrite(uid, snapshot, generation = authGeneration) {
    cloudWriteQueue = cloudWriteQueue.then(() => saveData(uid, snapshot, generation)).catch(() => {});
    return cloudWriteQueue;
  }
  // Holiday keys count as a signature here too, matching `backup.mjs` and iOS.
  // Without them a document whose only Sprout keys were holiday ones was
  // rejected as unrecognized and blocked saving.
  function validateStoredSnapshot(data) {
    if (!data || typeof data !== "object" || !["transactions","currentMonth","personalBudget","groceryBudget","monthHistory","recurringRules","personalCategories","holidaySeason","holidaySeasonHistory"].some(key => Object.hasOwn(data, key))) {
      throw new Error("The saved document is not a recognized Sprout ledger.");
    }
    return normalizeSnapshot(data);
  }
  function processDisplayedRecurring() {
    const today = getToday();
    const cutoff = state.currentMonth < today.slice(0,7)
      ? `${state.currentMonth}-${String(displayedMonth().days).padStart(2,"0")}` : today;
    return processRecurring(state, cutoff);
  }

  function stateSnapshot() {
    return {
      schemaVersion: 1, // Legacy web/Firebase payloads remain in dollars.
      groceryBudget: state.groceryBudget,
      personalBudget: state.personalBudget,
      groceryCarryover: state.groceryCarryover,
      personalCarryover: state.personalCarryover,
      transactions: state.transactions,
      recurringRules: state.recurringRules,
      monthHistory: state.monthHistory,
      currentMonth: state.currentMonth,
      personalCategories: state.personalCategories,
      // Cents, deliberately — see the header of holiday.mjs.
      holidaySeason: state.holidaySeason ?? null,
      holidaySeasonHistory: state.holidaySeasonHistory ?? null,
      updatedAt: state.updatedAt || new Date().toISOString()
    };
  }

  function applyPersistedData(d = {}) {
    const {snapshot, warnings} = normalizeSnapshot(d);
    Object.assign(state, snapshot);
    state.selectedHistoryMonthKey = null;
    state.selectedCalDay = null;
    state.showForm = null;
    state.editingTransactionId = null;
    state.editingBudget = false;
    state.showReset = state.currentMonth !== getCurrentMonth();
    state.formEmoji = state.personalCategories[0]?.emoji || "🛍️";
    // `null` from the importer means "this account has no holiday data", which
    // is an empty season, not an absent one. Substituting here rather than in
    // the importer keeps the snapshot honest about what was actually stored.
    state.holidaySeason = state.holidaySeason ?? Holiday.emptySeason();
    state.holidaySeasonHistory = state.holidaySeasonHistory ?? [];
    state.holidayForm = null;
    state.holidayFormError = "";
    state.holidaySearch = "";
    state.holidayDetailId = undefined;
    state.showHolidaySeasons = false;
    state.pendingHolidayDelete = null;
    if (warnings.length) {
      state.writeBlocked = true;
      state.statusMessage = `Some saved data needs attention: ${warnings.join(" ")} Saving is paused. Export the recovered data or import a valid backup before continuing.`;
    }
  }

  function cacheKeyForUser(uid) { return `${LOCAL_CACHE_KEY}:${uid}`; }
  function preserveRecovery(uid, raw) {
    // Keep the original bytes; never replace an existing recovery copy on load.
    const key = `${cacheKeyForUser(uid)}:recovery`;
    if (!localStorage.getItem(key)) localStorage.setItem(key, raw);
  }
  function loadLocalCache(uid) {
    if (!uid) return null;
    const key = cacheKeyForUser(uid);
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      try {
        const data = JSON.parse(raw);
        const result = validateStoredSnapshot(data);
        if (result.warnings.length) preserveRecovery(uid, raw);
        return data;
      } catch (error) {
        preserveRecovery(uid, raw);
        const previous = localStorage.getItem(`${key}:previous`);
        state.statusMessage = "The local save could not be read. Its original contents were kept for recovery. Saving is paused until you import a valid backup.";
        state.writeBlocked = true;
        if (previous) {
          const data = JSON.parse(previous);
          validateStoredSnapshot(data);
          state.statusMessage = "Recovered the previous local save. The damaged save was kept. Saving is paused; export and re-import the recovered data after reviewing it, or import another valid backup.";
          return data;
        }
        return null;
      }
    } catch (error) {
      state.writeBlocked = true;
      state.statusMessage = "Local storage is unavailable or unreadable. Saving is paused; export a backup before closing this page.";
      return null;
    }
  }
  function saveLocalCache(snapshot = stateSnapshot()) {
    if (!state.user || state.writeBlocked) return false;
    try {
      const key = cacheKeyForUser(state.user.uid);
      const previous = localStorage.getItem(key);
      if (previous && previous !== JSON.stringify(snapshot)) {
        // Only rotate a valid save. Damaged originals remain in the recovery slot.
        normalizeSnapshot(JSON.parse(previous), {strict:true});
        localStorage.setItem(`${key}:previous`, previous);
      }
      localStorage.setItem(key, JSON.stringify(snapshot));
      return true;
    } catch (error) {
      state.statusMessage = "Your latest change could not be saved on this device. Export a backup now. Cloud saving will still be attempted.";
      return false;
    }
  }
  function persistedTimestamp(data) {
    const t = new Date(data?.updatedAt || 0).getTime();
    return Number.isFinite(t) ? t : 0;
  }
  function nextUpdateTimestamp() {
    return new Date(Math.max(Date.now(), persistedTimestamp(state) + 1)).toISOString();
  }
  function scheduleSave() {
    if (!state.user || !state.dataReady || state.writeBlocked) return;
    state.updatedAt = nextUpdateTimestamp();
    const uid = state.user.uid;
    const generation = authGeneration;
    const snapshot = structuredClone(stateSnapshot());
    saveLocalCache(snapshot);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      queueCloudWrite(uid, snapshot, generation);
    }, 500);
  }
  async function saveData(uid, snapshot, generation) {
    if (state.user?.uid !== uid || generation !== authGeneration || state.writeBlocked) return;
    try {
      await setDoc(doc(db, "budgets", uid), snapshot, {merge:true});
    } catch (error) {
      if (state.user?.uid === uid && generation === authGeneration) {
        state.statusMessage = "Cloud sync failed. Your device copy may be newer; export a backup before switching devices. Reopen Sprout to retry syncing.";
        render();
      }
    }
  }
  async function loadData() {
    const uid = state.user?.uid;
    if (!uid) return;
    const generation = authGeneration;
    state.dataReady = false;
    state.writeBlocked = false;
    state.statusMessage = "";
    state.canUndoImport = false;
    const local = loadLocalCache(uid);
    applyPersistedData(local || {});
    try { state.canUndoImport = Boolean(localStorage.getItem(`${cacheKeyForUser(uid)}:before-import`)); } catch {}
    try {
      const ref = doc(db, "budgets", uid);
      const snap = await getDoc(ref);
      if (state.user?.uid !== uid || generation !== authGeneration) return;
      if (snap.exists()) {
        const cloud = snap.data();
        // Validate even an older remote document before overwriting it.
        try {
          const result = validateStoredSnapshot(cloud);
          if (result.warnings.length) {
            preserveRecovery(uid, JSON.stringify(cloud));
            state.writeBlocked = true;
            state.statusMessage = "Some cloud data could not be read. Its original contents were saved for recovery. Import a valid backup before resuming saves.";
          }
        } catch (error) {
          try { preserveRecovery(uid, JSON.stringify(cloud)); } catch {}
          state.writeBlocked = true;
          state.statusMessage = "The cloud save has an unsupported or damaged format. Saving is paused to protect it. Export this device's data and recover a valid backup.";
          state.dataReady = true;
          return;
        }
        if (!local || persistedTimestamp(cloud) > persistedTimestamp(local)) {
          applyPersistedData(cloud);
          saveLocalCache();
        } else if (persistedTimestamp(local) > persistedTimestamp(cloud) && !state.writeBlocked) {
          await queueCloudWrite(uid, structuredClone(stateSnapshot()), generation);
        }
      } else if (local && !state.writeBlocked) {
        await queueCloudWrite(uid, structuredClone(stateSnapshot()), generation);
      }
    } catch (error) {
      if (state.user?.uid !== uid || generation !== authGeneration) return;
      state.statusMessage = local
        ? "Cloud data could not be loaded. Using this device's copy; export a backup before switching devices."
        : "Cloud data could not be loaded and there is no readable device copy. Saving is paused to protect your existing data. Reopen Sprout to retry.";
      if (!local) state.writeBlocked = true;
    }
    if (state.user?.uid !== uid || generation !== authGeneration) return;
    state.dataReady = true;
    if (!state.writeBlocked && processDisplayedRecurring()) scheduleSave();
  }


  // ── Auth ──
  onAuthStateChanged(auth, async (user) => {
    authGeneration++;
    state.user = user;
    state.authLoading = false;
    state.authError = "";
    clearTimeout(saveTimer);
    state.pendingImport = null;
    state.pendingAction = null;
    if (user) {
      await loadData();
    }
    render();
  });

  async function handleSignIn() {
    state.authError = "";
    render();

    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error("Sign-in error:", e);

      if (
        e?.code === "auth/popup-blocked" ||
        e?.code === "auth/popup-closed-by-user" ||
        e?.code === "auth/cancelled-popup-request" ||
        e?.code === "auth/operation-not-supported-in-this-environment"
      ) {
        state.authError = "Popup sign-in was blocked here. Trying redirect sign-in instead.";
        render();
        try {
          await signInWithRedirect(auth, provider);
          return;
        } catch (redirectError) {
          console.error("Redirect sign-in error:", redirectError);
          state.authError = redirectError?.message || "Popup and redirect sign-in both failed. Check the browser console for details.";
        }
      } else if (
        e?.code === "auth/api-key-not-valid" ||
        e?.code === "auth/invalid-api-key"
      ) {
        state.authError = "This Firebase web API key is not valid for the current app. Check the key value and its Google/Firebase restrictions.";
      } else if (
        e?.code === "auth/unauthorized-domain"
      ) {
        state.authError = `This page's domain is not authorized for Firebase Auth. Current host: ${window.location.hostname || window.location.origin}. Add that exact host under Firebase Authentication authorized domains.`;
      } else {
        state.authError = e?.message || "Google sign-in failed. Check the browser console for the Firebase error details.";
      }

      render();
    }
  }

  function handleSignOut() {
    authGeneration++;
    // Order matters. `signOut` is async and `onAuthStateChanged` has not fired
    // yet, so `state.user` is still set and any save scheduled in the last 500ms
    // is still pending. Resetting state first and letting that timer fire would
    // write the *emptied* snapshot to the signed-out user's Firestore document
    // and local cache — permanently destroying their budgets, history and
    // transactions. Cancel the write and drop the identity before clearing.
    clearTimeout(saveTimer);
    saveTimer = null;
    state.user = null;
    state.dataReady = false;
    state.writeBlocked = false;
    state.statusMessage = "";
    state.pendingImport = null;
    state.pendingAction = null;
    state.canUndoImport = false;

    // The last <=500ms of edits are dropped from Firestore by that clearTimeout,
    // but `scheduleSave` already wrote them to localStorage and `loadData` prefers
    // the newer timestamp on the next sign-in. That fallback is load-bearing.
    signOut(auth).catch((e) => console.error("Sign-out error:", e)).finally(() => render());
    // Clearing only `transactions` left budgets, carryover, categories and month
    // history from the previous account on screen and in memory.
    applyPersistedData({});
    state.activeSection = "personal";
    state.showSettings = false;
    state.showCalendar = false;
    state.showForm = null;
    state.selectedCalDay = null;
    state.selectedHistoryMonthKey = null;
    state.pendingDeleteId = null;
    state.showReset = false;
  }

  // ── Actions ──
  // ── Holiday ──
  // Holiday money is integer cents throughout (holiday.mjs explains why), so
  // every display goes through `holidayMoney` and every input through
  // `parseHolidayCents`. Nothing here touches the monthly ledger, and no
  // monthly figure can reach the season: `budgetCat()` never answers
  // "holiday", so `getTx`/`netSpent`/`getBudget` cannot be pointed at it.
  function budgetCat() { return state.activeSection === "grocery" ? "grocery" : "personal"; }
  function season() { return state.holidaySeason; }
  function holidayMoney(cents) { return fmtCurrency(fromCents(cents)); }
  function parseHolidayCents(text) {

  function startHolidayGiftForm({ id = null, recipientID = undefined, isReturn = false } = {}) {

    state.holidayFormError = "";
    state.holidayForm = existing
      ? {

          date: holidayDayValue(existing.date), recipientID: existing.recipientID ?? null,
          // Already decided for an existing row.
          recipientChosen: true, isReturn: existing.isReturn,

  function startHolidayPersonForm(id = null) {
    const person = Holiday.findRecipient(season(), id);

      kind: "person",
      id: person ? person.id : null,
      name: person ? person.name : "",
      emoji: person ? person.emoji : Holiday.DEFAULT_RECIPIENT_EMOJI,
      // Empty means "no target", which is deliberately not "a target of zero".
      planned: person && person.plannedAmount != null ? editableAmount(fromCents(person.plannedAmount)) : "",
    };
    render();
  }

  function saveHolidayGift() {
    if (!canEdit()) return;
    const form = state.holidayForm;
    const current = season();
    const name = form.name.trim();
    if (!name) { state.holidayFormError = "Add a short description first."; render(); return; }
    const cents = parseHolidayCents(form.amount);
    if (cents === null || cents <= 0) {
      state.holidayFormError = "Enter an amount from $0.01 to $999,999.99.";
      render(); return;
    }
    if (!form.recipientChosen && current.recipients.length > 0) {
      state.holidayFormError = `Choose who this ${form.isReturn ? "return" : "gift"} is for, or “${Holiday.UNASSIGNED_LABEL}”.`;
      render(); return;
    }
    const row = {
      id: form.id || newHolidayId(),
      recipientID: form.recipientID ?? null,
      name, amount: cents, note: form.note.trim(),
      date: holidayDateToIso(form.date), isReturn: Boolean(form.isReturn),
    };

      ? current.purchases.map(existing => (existing.id === form.id ? row : existing))
      : [...current.purchases, row];
    state.holidayForm = null;
    state.holidayFormError = "";
    commitSeason({ ...current, purchases });
    render();
  }

  function saveHolidayPerson() {
    if (!canEdit()) return;
    const form = state.holidayForm;
    const current = season();
    const name = form.name.trim();
    if (!name) { state.holidayFormError = "Give this person a name first."; render(); return; }
    let planned = null;
    if (form.planned.trim() !== "") {
      const cents = parseHolidayCents(form.planned);
      if (cents === null || cents < 0) {
        state.holidayFormError = "Enter a planned amount from $0 to $999,999.99, or leave it empty.";
        render(); return;
      }
      planned = cents;
    }
    if (!form.id && current.recipients.length >= Holiday.RECIPIENT_LIMIT) {
      state.holidayFormError = `Sprout holds up to ${Holiday.RECIPIENT_LIMIT} people in a season.`;
      render(); return;
    }
    const person = {
      id: form.id || newHolidayId(),
      name, emoji: form.emoji || Holiday.DEFAULT_RECIPIENT_EMOJI,
      plannedAmount: planned,
      createdAt: form.id
        ? (Holiday.findRecipient(current, form.id)?.createdAt || new Date().toISOString())
        : new Date().toISOString(),
    };
    const recipients = form.id
      ? current.recipients.map(existing => (existing.id === form.id ? person : existing))

    state.holidayFormError = "";

    render();

  function saveHolidayNewSeason() {
    if (!canEdit()) return;
    const form = state.holidayForm;
    const archived = !Holiday.seasonIsEmpty(season());
    const next = Holiday.startNewSeason({
      season: season(), history: state.holidaySeasonHistory,
      label: form.label, carryRecipients: Boolean(form.carry) && season().recipients.length > 0,
    });
    state.holidayForm = null;
    state.holidayFormError = "";
    state.holidayDetailId = undefined;
    state.holidaySearch = "";
    commitSeason(next.season, next.history);
    // An untouched season is not archived, so saying it was would name a row
    // that is not in Past seasons.
    state.statusMessage = archived
      ? "New holiday season started. The one you closed is under Past seasons."
      : "New holiday season started.";
    render();
  }

  function saveHolidayRename() {
    if (!canEdit()) return;
    const label = state.holidayForm.label.trim();
    if (!label) { state.holidayFormError = "Give this season a name."; render(); return; }
    state.holidayForm = null;
    state.holidayFormError = "";
    commitSeason({ ...season(), label });
    render();
  }

  function confirmHolidayDelete() {
    const pending = state.pendingHolidayDelete;
    state.pendingHolidayDelete = null;
    if (!pending || !canEdit()) { render(); return; }
    const current = season();
    if (pending.kind === "gift") {
      commitSeason({ ...current, purchases: current.purchases.filter(row => row.id !== pending.id) });
    } else if (pending.kind === "person") {
      // Removing a person removes the gifts logged against them. Leaving those
      // behind would keep money in the season total with nobody attached to
      // explain it; the confirmation names the exact figure that leaves.
      commitSeason({
        ...current,
        recipients: current.recipients.filter(person => person.id !== pending.id),
        purchases: current.purchases.filter(row => row.recipientID !== pending.id),
      });
      if (state.holidayDetailId === pending.id) state.holidayDetailId = undefined;
    } else {
      commitSeason(current, state.holidaySeasonHistory.filter(past => past.id !== pending.id));
    }
    render();
  }

  /**
   * Leaving a section closes what belonged to it.
   *
   * A named function rather than the body of a click handler, because the
   * clearing is behaviour worth testing: a holiday form left open behind the
   * Personal tab would reopen on a screen with no place for it, a stale
   * per-person view would survive the switch, a query typed on one tab would
   * filter the other, and a pending delete whose row had since gone rendered
   * nothing while leaving "Past seasons" a dead button.
   */
  function switchSection(section) {
    state.activeSection = section;
    state.showCalendar = false; state.showForm = null; state.editingTransactionId = null;
    state.selectedCalDay = null; state.editingBudget = false;
    state.holidayForm = null; state.holidayFormError = "";
    state.holidayDetailId = undefined; state.holidaySearch = "";
    state.txSearch = "";
    state.pendingHolidayDelete = null; state.showHolidaySeasons = false;
    state.formEmoji = budgetCat() === "personal" ? (state.personalCategories[0]?.emoji || "🛍️") : "🛒";
    render();
  }

  function getTx(cat) { return state.transactions.filter(t => t.type === cat).sort(compareTxByDateOnly); }
  function netSpent(cat) { return sumTransactions(getTx(cat)); }
  function getBaseBudget(cat) { return cat === "grocery" ? state.groceryBudget : state.personalBudget; }
  function getBudget(cat) { return sumMoney(getBaseBudget(cat), getCarryover(cat)); }
  function getRemaining(cat) { return sumMoney(getBudget(cat), -netSpent(cat)); }

  function getRecent(cat) {
    const seen = new Set();
      return getTx(cat).filter(t=>!t.isRefund).reverse().filter(t => {
      if (seen.has(t.name)) return false;
      seen.add(t.name); return true;
    }).slice(0,5);
  }

  // `Date.now().toString()` collides for two entries filed in the same
  // millisecond, and `deleteTransaction` filters by id — so removing one of a
  // colliding pair removed both.
  function newTransactionId() {
    if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
      return crypto.randomUUID();
    }
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function canEdit() { return state.dataReady && !state.writeBlocked; }
  function startForm(mode, seed = null, edit = false) {
    state.showForm = mode;
    state.editingTransactionId = edit ? seed.id : null;
    state.formName = seed?.name || "";
    state.formAmount = edit ? editableAmount(seed.amount) : "";
    state.formNote = edit ? seed.note : "";
    state.formEmoji = seed?.emoji || state.personalCategories[0]?.emoji || "🛍️";
    state.formDate = edit ? seed.date : getToday();
    state.formRecurring = false;
    state.formFrequency = "monthly";
    state.formNextDate = nextOccurrence(state.formDate, "monthly", Number(state.formDate.slice(-2)));

    render();
  }
  function addTransaction(isRefund) {
    if (!canEdit()) return;
    const amount = parseAmount(state.formAmount, navigator.language || "en-US");
    if (!state.formName.trim() || amount === null || amount <= 0 || !validDate(state.formDate)) {
      state.formError = "Enter a name, a valid date, and an amount from $0.01 to $999,999.99. Use numbers and a decimal separator only.";
      render(); return;
    }
    if (state.formRecurring && (!validDate(state.formNextDate) || state.formNextDate <= state.formDate)) {
      state.formError = "The next recurring date must be after this transaction's date.";
      render(); return;
    }
    const entry = {
      id: state.editingTransactionId || newTransactionId(),
      name: state.formName.trim(), amount, note: state.formNote.trim(),
      emoji: isRefund ? "💸" : (budgetCat() === "grocery" ? "🛒" : state.formEmoji),
      date: state.formDate, type: budgetCat(), isRefund,
    };
    if (state.editingTransactionId) {
      const index = state.transactions.findIndex(t => t.id === state.editingTransactionId);
      if (index < 0) return;
      state.transactions[index] = entry;
    } else {
      state.transactions.push(entry);
      if (state.formRecurring) {
        const day = Number(entry.date.slice(-2));
        const defaultNext = nextOccurrence(entry.date, state.formFrequency, day);
        state.recurringRules.push({...entry, id:newTransactionId(), frequency:state.formFrequency,
          nextOccurrenceDate:state.formNextDate,
          anchorDay:state.formNextDate === defaultNext ? day : Number(state.formNextDate.slice(-2))});
      }
    }
    state.showForm = null; state.editingTransactionId = null;
    processDisplayedRecurring();
    scheduleSave(); render();
  }
  function deleteTransaction(id) {
    if (!canEdit()) return;
    state.transactions = state.transactions.filter(t => t.id !== id);
    state.pendingDeleteId = null;
    scheduleSave(); render();
  }
  function resetMonth(carryOverRemainders = false) {
    if (!canEdit()) return;
    resetLedger(state, getToday(), carryOverRemainders);
    state.showReset = false; state.selectedCalDay = null; state.selectedHistoryMonthKey = null;
    state.showForm = null; state.editingTransactionId = null;
    scheduleSave(); render();
  }
  function downloadJSON(data, name) {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a"); link.href = url; link.download = name; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function exportCurrentBackup() {
    try { downloadJSON(exportBackup(stateSnapshot()), `Sprout-Backup-${getToday()}.json`); }
    catch (error) { state.statusMessage = `Backup export failed: ${error.message}`; render(); }
  }
  /** What the incoming file carries on the holiday side. Stated even when it
   * is nothing, because importing a file without holiday data still replaces
   * the holiday data you have. */
  function holidayImportSummary(pending) {
    if (!pending.hasHoliday) return "This backup has no holiday data.";
    const incoming = pending.snapshot.holidaySeason;
    const parts = [];
    if (incoming) {
      const gifts = Holiday.giftCount(incoming);
      const people = incoming.recipients.length;
      parts.push(`${gifts} holiday gift${gifts === 1 ? "" : "s"}`);
      if (people > 0) parts.push(`${people} ${people === 1 ? "person" : "people"}`);
    }
    const seasons = (pending.snapshot.holidaySeasonHistory || []).length;
    if (seasons > 0) parts.push(`${seasons} past season${seasons === 1 ? "" : "s"}`);
    return parts.length ? `Holiday: ${parts.join(", ")}.` : "This backup has no holiday data.";
  }

  /** What the import would destroy on the holiday side. The prompt used to

   * take the season, every person and every gift. */
  /// Returns plain text, not markup. The caller escapes it: this is the one
  /// holiday string that is built from a user-controlled value (the season
  /// label) and then interpolated into the template, and it was going in raw.
  function holidayReplacementWarning() {
    const current = season();
    const gifts = Holiday.giftCount(current);
    const people = current.recipients.length;
    const seasons = state.holidaySeasonHistory.length;
    if (!gifts && !people && !seasons && !Holiday.seasonHasBudget(current)) return "";
    const parts = [];
    if (gifts || people || Holiday.seasonHasBudget(current)) {
      const inner = [];
      if (gifts) inner.push(`${gifts} gift${gifts === 1 ? "" : "s"}`);
      if (people) inner.push(`${people} ${people === 1 ? "person" : "people"}`);
      parts.push(inner.length ? `${current.label} (${inner.join(", ")})` : current.label);
    }
    if (seasons) parts.push(`${seasons} past season${seasons === 1 ? "" : "s"}`);
    return ` You will lose ${parts.join(" and ")}.`;
  }

  async function previewImport(file) {
    if (!file || !state.user) return;
    const uid = state.user.uid;
    const generation = authGeneration;
    try {
      if (file.size > 10 * 1024 * 1024) throw new Error("Choose a JSON backup smaller than 10 MB.");
      const raw = JSON.parse(await file.text());
      const {snapshot} = normalizeSnapshot(raw, {strict:true});
      if (state.user?.uid !== uid || generation !== authGeneration) return;
      // Kept from the raw payload: the normalized snapshot turns an absent
      // holiday section into an empty season, which looks identical to a real
      // season nobody has shopped for yet.
      state.pendingImport = {snapshot, uid, generation, hasHoliday: containsHolidayData(raw)};
    } catch (error) { state.statusMessage = `Backup was not imported: ${error.message}`; }
    render();
  }
  function confirmImport() {
    const pending = state.pendingImport;
    if (!pending || pending.uid !== state.user?.uid || pending.generation !== authGeneration) return;
    try {
      const replacement = {...pending.snapshot, updatedAt:nextUpdateTimestamp()};
      const key = cacheKeyForUser(pending.uid);
      const raw = localStorage.getItem(key);
      if (state.writeBlocked && raw) preserveRecovery(pending.uid, raw);
      // Complete both durable writes before changing live state or scheduling cloud writes.
      localStorage.setItem(`${key}:before-import`, JSON.stringify(stateSnapshot()));
      localStorage.setItem(key, JSON.stringify(replacement));
      clearTimeout(saveTimer);
      authGeneration++;
      state.writeBlocked = false;
      applyPersistedData(replacement);
      state.canUndoImport = true;
      state.pendingImport = null;
    state.pendingAction = null;
      state.statusMessage = "Backup imported. This replaces the signed-in account's cloud data too. You can undo this import from Settings.";
      scheduleSave();
    } catch (error) { state.statusMessage = `Backup was not imported: ${error.message}`; }
    render();
  }
  function undoImport() {
    if (!state.user) return;
    try {
      const key = cacheKeyForUser(state.user.uid);
      const raw = localStorage.getItem(`${key}:before-import`);
      if (!raw) throw new Error("The safety copy is unavailable.");
      const {snapshot} = normalizeSnapshot(JSON.parse(raw), {strict:true});
      snapshot.updatedAt = nextUpdateTimestamp();
      localStorage.setItem(key, JSON.stringify(snapshot));
      clearTimeout(saveTimer); authGeneration++; state.writeBlocked = false;
      applyPersistedData(snapshot);
      try { localStorage.removeItem(`${key}:before-import`); } catch {}
      state.canUndoImport = Boolean(localStorage.getItem(`${key}:before-import`));
      state.statusMessage = "Restored the data from before the import.";
      scheduleSave();
    } catch (error) { state.statusMessage = `Could not undo import: ${error.message}`; }
    render();
  }

  function refreshDate() {
    if (!state.user || !state.dataReady || document.hidden) return;
    if (state.currentMonth !== getCurrentMonth()) state.showReset = true;
    if (!state.writeBlocked && processDisplayedRecurring()) scheduleSave();
    render();
  }


  // ── Render ──
